<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
<title>Explicit neutral, coupled series element, and separately declared shunts</title>
<desc>A two-conductor source at one and zero volts feeds a phase-neutral constant-power load. The coupled series resistance is one ohm on the diagonal and one half ohm off diagonal. A one tenth siemens source shunt, two sevenths siemens receiving phase-neutral shunt and one siemens neutral-earth shunt make source, series and load currents distinct. Current arrows indicate reference orientation, not actual positive flow.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#17212b"/></marker></defs>
<rect width="1280" height="600" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" font-size="20" fill="#17212b">
<text x="30" y="40" font-size="28" text-anchor="start">Same circuit, different current observations</text>
<text x="30" y="77" font-size="19" text-anchor="start">Native series-line ratings apply between the shunt connections. Arrows define signed references.</text>
<line x1="100" y1="170" x2="1110" y2="170" stroke="#17212b" stroke-width="2.5"/>
<circle cx="100" cy="170" r="5" fill="#17212b"/>
<circle cx="260" cy="170" r="5" fill="#17212b"/>
<circle cx="800" cy="170" r="5" fill="#17212b"/>
<circle cx="925" cy="170" r="5" fill="#17212b"/>
<circle cx="1110" cy="170" r="5" fill="#17212b"/>
<line x1="100" y1="390" x2="1110" y2="390" stroke="#17212b" stroke-width="2.5"/>
<circle cx="100" cy="390" r="5" fill="#17212b"/>
<circle cx="260" cy="390" r="5" fill="#17212b"/>
<circle cx="800" cy="390" r="5" fill="#17212b"/>
<circle cx="925" cy="390" r="5" fill="#17212b"/>
<circle cx="1110" cy="390" r="5" fill="#17212b"/>
<line x1="100" y1="170" x2="100" y2="242" stroke="#17212b" stroke-width="2.5"/>
<line x1="100" y1="318" x2="100" y2="485" stroke="#17212b" stroke-width="2.5"/>
<circle cx="100" cy="280" r="38" fill="white" stroke="#17212b" stroke-width="2.5"/>
<text x="100" y="272" font-size="24" text-anchor="middle">+</text>
<text x="100" y="304" font-size="24" text-anchor="middle">−</text>
<text x="32" y="285" font-size="19" text-anchor="start">1 V</text>
<line x1="78" y1="485" x2="122" y2="485" stroke="#17212b" stroke-width="2.5"/>
<line x1="85" y1="492" x2="115" y2="492" stroke="#17212b" stroke-width="2.5"/>
<line x1="93" y1="499" x2="107" y2="499" stroke="#17212b" stroke-width="2.5"/>
<text x="60" y="135" font-size="20" text-anchor="start">f:a = 1 V</text>
<text x="40" y="425" font-size="20" text-anchor="start">f:n = 0 V</text>
<text x="140" y="472" font-size="17" text-anchor="start">Earth reaction is separate</text>
<line x1="260" y1="170" x2="260" y2="240" stroke="#17212b" stroke-width="2.5"/>
<rect x="245" y="240" width="30" height="70" fill="white" stroke="#17212b" stroke-width="2.5"/>
<line x1="260" y1="310" x2="260" y2="390" stroke="#17212b" stroke-width="2.5"/>
<text x="288" y="279" font-size="20" text-anchor="start">1/10 S</text>
<line x1="800" y1="170" x2="800" y2="240" stroke="#17212b" stroke-width="2.5"/>
<rect x="785" y="240" width="30" height="70" fill="white" stroke="#17212b" stroke-width="2.5"/>
<line x1="800" y1="310" x2="800" y2="390" stroke="#17212b" stroke-width="2.5"/>
<text x="828" y="279" font-size="20" text-anchor="start">2/7 S</text>
<rect x="475" y="155" width="60" height="30" fill="white" stroke="#17212b" stroke-width="2.5"/>
<text x="505" y="177" font-size="17" text-anchor="middle">1 Ω</text>
<rect x="475" y="375" width="60" height="30" fill="white" stroke="#17212b" stroke-width="2.5"/>
<text x="505" y="397" font-size="17" text-anchor="middle">1 Ω</text>
<line x1="505" y1="200" x2="505" y2="350" stroke="#17212b" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="540" y="267" font-size="18" text-anchor="start">Mutual R = 1/2 Ω</text>
<text x="540" y="293" font-size="16" text-anchor="start">(not another wire)</text>
<line x1="1110" y1="170" x2="1110" y2="240" stroke="#17212b" stroke-width="2.5"/>
<rect x="1050" y="240" width="120" height="80" fill="white" stroke="#17212b" stroke-width="2.5"/>
<line x1="1110" y1="320" x2="1110" y2="390" stroke="#17212b" stroke-width="2.5"/>
<text x="1110" y="271" font-size="18" text-anchor="middle">Coil load</text>
<text x="1110" y="301" font-size="18" text-anchor="middle">6/35 W</text>
<line x1="925" y1="390" x2="925" y2="450" stroke="#17212b" stroke-width="2.5"/>
<rect x="910" y="450" width="30" height="50" fill="white" stroke="#17212b" stroke-width="2.5"/>
<line x1="925" y1="500" x2="925" y2="530" stroke="#17212b" stroke-width="2.5"/>
<line x1="903" y1="530" x2="947" y2="530" stroke="#17212b" stroke-width="2.5"/>
<line x1="910" y1="537" x2="940" y2="537" stroke="#17212b" stroke-width="2.5"/>
<line x1="918" y1="544" x2="932" y2="544" stroke="#17212b" stroke-width="2.5"/>
<text x="955" y="480" font-size="20" text-anchor="start">1 S to earth</text>
<text x="725" y="135" font-size="20" text-anchor="start">t:x = v_a</text>
<text x="700" y="425" font-size="20" text-anchor="start">t:n = v_n ≠ 0</text>
<line x1="125" y1="150" x2="215" y2="150" stroke="#17212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="158" y="128" font-size="20" text-anchor="start">I_s</text>
<line x1="350" y1="145" x2="430" y2="145" stroke="#17212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380" y="125" font-size="20" text-anchor="start">I_a</text>
<line x1="350" y1="365" x2="430" y2="365" stroke="#17212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380" y="345" font-size="20" text-anchor="start">I_n</text>
<line x1="1200" y1="210" x2="1200" y2="285" stroke="#17212b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1220" y="255" font-size="22" text-anchor="start">j</text>
<text x="30" y="574" font-size="21" text-anchor="start">Low root: |I_n| = 24/35 A > 1/2 A, while both neutral power caps pass.</text>
</g>
</svg>
