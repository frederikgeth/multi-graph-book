<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<title>One network, five languages</title>
<desc>Five rows translate familiar community language into the book's typed vocabulary and state one unsafe inference for each community.</desc>
<rect width="1400" height="980" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#5f6b76}.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.community{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.bridge{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.warning{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.row{fill:#fbfcfd;stroke:#17212b;stroke-width:1.5}.arrow{stroke:#17212b;stroke-width:2;fill:none;marker-end:url(#arrow)}.tag{fill:#eee8f8;stroke:#7856a8;stroke-width:1.5}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="46" class="title" text-anchor="start">One network, five languages</text>
<text x="40" y="76" class="sub" text-anchor="start">Translate the object and query—not only the word. Each community sees a useful view and carries a characteristic risk.</text>
<rect x="40" y="105" width="1320" height="82" rx="14" class="tag"/>
<text x="700" y="137" class="head" text-anchor="middle">shared semantic anchor</text>
<text x="700" y="164" class="body" text-anchor="middle">identified assets · ordered ports · junctions · factors · states · limits · provenance</text>
<text x="55" y="225" class="head" text-anchor="start">community language</text>
<text x="430" y="225" class="head" text-anchor="start">bridge used in this book</text>
<text x="930" y="225" class="head" text-anchor="start">unsafe inference</text>
<rect x="40" y="250" width="1320" height="108" rx="12" class="row"/>
<rect x="55" y="264" width="325" height="80" rx="10" class="community"/>
<rect x="420" y="264" width="430" height="80" rx="10" class="bridge"/>
<rect x="910" y="264" width="430" height="80" rx="10" class="warning"/>
<text x="217" y="293" class="head" text-anchor="middle">power engineering</text>
<text x="217" y="320" class="small" text-anchor="middle">bus · feeder · line · radial · power flow</text>
<text x="635" y="308" class="body" text-anchor="middle">name graph, active state, terminal quantity</text>
<text x="1125" y="308" class="body" text-anchor="middle">one arrow or edge carries one conserved flow</text>
<path d="M380 304 L410 304" class="arrow"/>
<path d="M850 304 L900 304" class="arrow"/>
<rect x="40" y="378" width="1320" height="108" rx="12" class="row"/>
<rect x="55" y="392" width="325" height="80" rx="10" class="community"/>
<rect x="420" y="392" width="430" height="80" rx="10" class="bridge"/>
<rect x="910" y="392" width="430" height="80" rx="10" class="warning"/>
<text x="217" y="421" class="head" text-anchor="middle">software and network data</text>
<text x="217" y="448" class="small" text-anchor="middle">equipment · terminal · connectivity node · status</text>
<text x="635" y="436" class="body" text-anchor="middle">name source/generated object and provenance map</text>
<text x="1125" y="436" class="body" text-anchor="middle">a record, compiled bus, and physical asset are identical</text>
<path d="M380 432 L410 432" class="arrow"/>
<path d="M850 432 L900 432" class="arrow"/>
<rect x="40" y="506" width="1320" height="108" rx="12" class="row"/>
<rect x="55" y="520" width="325" height="80" rx="10" class="community"/>
<rect x="420" y="520" width="430" height="80" rx="10" class="bridge"/>
<rect x="910" y="520" width="430" height="80" rx="10" class="warning"/>
<text x="217" y="549" class="head" text-anchor="middle">mathematical modelling</text>
<text x="217" y="576" class="small" text-anchor="middle">variable · constraint · feasible set · relaxation</text>
<text x="635" y="564" class="body" text-anchor="middle">name observation, decision, and recovery maps</text>
<text x="1125" y="564" class="body" text-anchor="middle">equal equations imply equal feasible decisions</text>
<path d="M380 560 L410 560" class="arrow"/>
<path d="M850 560 L900 560" class="arrow"/>
<rect x="40" y="634" width="1320" height="108" rx="12" class="row"/>
<rect x="55" y="648" width="325" height="80" rx="10" class="community"/>
<rect x="420" y="648" width="430" height="80" rx="10" class="bridge"/>
<rect x="910" y="648" width="430" height="80" rx="10" class="warning"/>
<text x="217" y="677" class="head" text-anchor="middle">mathematical graph theory</text>
<text x="217" y="704" class="small" text-anchor="middle">vertex · edge/arc · cycle · quotient · minor</text>
<text x="635" y="692" class="body" text-anchor="middle">name object types, incidence, graph, and morphism</text>
<text x="1125" y="692" class="body" text-anchor="middle">unlabelled topology determines electrical meaning</text>
<path d="M380 688 L410 688" class="arrow"/>
<path d="M850 688 L900 688" class="arrow"/>
<rect x="40" y="762" width="1320" height="108" rx="12" class="row"/>
<rect x="55" y="776" width="325" height="80" rx="10" class="community"/>
<rect x="420" y="776" width="430" height="80" rx="10" class="bridge"/>
<rect x="910" y="776" width="430" height="80" rx="10" class="warning"/>
<text x="217" y="805" class="head" text-anchor="middle">graph machine learning</text>
<text x="217" y="832" class="small" text-anchor="middle">node/edge feature · message · pooling · hidden state</text>
<text x="635" y="820" class="body" text-anchor="middle">name compiled message graph and retained semantics</text>
<text x="1125" y="820" class="body" text-anchor="middle">pooling preserves member identity, limits, and n-port structure</text>
<path d="M380 816 L410 816" class="arrow"/>
<path d="M850 816 L900 816" class="arrow"/>
<rect x="40" y="905" width="1320" height="50" rx="12" class="tag"/>
<text x="700" y="936" class="head" text-anchor="middle">house rule: preferred term · accepted qualified shorthand · unsafe unqualified term</text>
</svg>
