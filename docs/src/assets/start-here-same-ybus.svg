<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<title>Same Y-bus. Different answer.</title>
<desc>A nodal admittance equality can preserve the linear terminal map while saying nothing about member limits or controls.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.tiny{font-size:13px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.bus2{fill:#e4f4e7;stroke:#477a55;stroke-width:3}
.wire{stroke:#3d78b5;stroke-width:5}.wire2{stroke:#7856a8;stroke-width:4}
.ground{stroke:#477a55;stroke-width:4}.accent{stroke:#8a4f13;stroke-width:4}
.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:9 7}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.matrix{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.matrix2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">Same Y-bus. Different answer.</text>
<text x="35" y="68" class="sub" text-anchor="start">A nodal admittance equality can preserve the linear terminal map while saying nothing about member limits or controls.</text>
<rect x="35" y="105" width="610" height="240" rx="12" class="panel"/>
<rect x="755" y="105" width="610" height="240" rx="12" class="panel"/>
<text x="65" y="145" class="head" text-anchor="start">network A</text>
<text x="785" y="145" class="head" text-anchor="start">network B</text>
<circle cx="165" cy="245" r="28" class="bus"/><text x="165" y="251" class="head" text-anchor="middle">i</text>
<circle cx="575" cy="245" r="28" class="bus"/><text x="575" y="251" class="head" text-anchor="middle">j</text>
<line x1="195" y1="230" x2="545" y2="230" class="wire"/>
<line x1="195" y1="260" x2="545" y2="260" class="wire"/>
<text x="370" y="220" class="small" text-anchor="middle">ℓ₁</text>
<text x="370" y="285" class="small" text-anchor="middle">ℓ₂</text>
<circle cx="885" cy="245" r="28" class="bus"/><text x="885" y="251" class="head" text-anchor="middle">i</text>
<circle cx="1295" cy="245" r="28" class="bus"/><text x="1295" y="251" class="head" text-anchor="middle">j</text>
<line x1="915" y1="230" x2="1265" y2="230" class="wire"/>
<line x1="915" y1="260" x2="1265" y2="260" class="wire"/>
<text x="1090" y="220" class="small" text-anchor="middle">ℓ₁</text>
<text x="1090" y="285" class="small" text-anchor="middle">ℓ₂</text>
<rect x="470" y="375" width="460" height="70" rx="12" class="good"/>
<text x="700" y="404" class="head" text-anchor="middle">‖Y_A − Y_B‖∞ = 0</text>
<text x="700" y="430" class="small" text-anchor="middle">same unconstrained terminal current relation</text>
<rect x="35" y="480" width="610" height="190" rx="12" class="panel"/>
<rect x="755" y="480" width="610" height="190" rx="12" class="panel"/>
<text x="65" y="520" class="head" text-anchor="start">decision model A</text>
<text x="785" y="520" class="head" text-anchor="start">decision model B</text>
<text x="65" y="570" class="body" text-anchor="start">member limits retained</text>
<text x="65" y="610" class="small" text-anchor="start">maximum served power</text>
<text x="350" y="615" class="head" text-anchor="middle">110 MW</text>
<text x="785" y="570" class="body" text-anchor="start">summed limit used</text>
<text x="785" y="610" class="small" text-anchor="start">maximum served power</text>
<text x="1070" y="615" class="head" text-anchor="middle">200 MW</text>
<rect x="35" y="705" width="1330" height="70" rx="12" class="bad"/>
<text x="55" y="733" class="head" text-anchor="start">resolution</text>
<text x="180" y="733" class="body" text-anchor="start">Y-bus is assembled from linear factors; limits, states, and controls live in the decision model. Your model dispatches 200 MW. Your conductor melts at 110.</text>
</svg>
