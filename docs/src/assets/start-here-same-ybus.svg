<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590">
<title>Same terminal law; different admissible currents</title><desc>Two resistive parallel members have conductances 10 S and 1 S and limits 100 A each. At a 15 V drop the total current is 165 A, but the first member carries 150 A and violates its rating.</desc>
<rect width="1100" height="590" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:20px}.title{font-size:29px;font-weight:bold}.head{font-size:23px;font-weight:bold}.small{font-size:18px}.math{font-family:DejaVu Sans,Arial,sans-serif;font-size:22px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17212b"/></marker></defs>
<text x="30" y="43" class="title" text-anchor="start">Same terminal law; different admissible currents</text>
<text x="30" y="78" class="small" text-anchor="start">Fixed resistive branches; no shunts. Current reference is from i to j.</text>
<text x="40" y="124" class="head" text-anchor="start">Source: retain both member limits</text>
<text x="605" y="124" class="head" text-anchor="start">Target: sum conductance and ratings</text>
<line x1="85" y1="250" x2="85" y2="205" stroke="#245b7a" stroke-width="3"/>
<line x1="85" y1="205" x2="485" y2="205" stroke="#245b7a" stroke-width="3"/>
<line x1="485" y1="205" x2="485" y2="250" stroke="#245b7a" stroke-width="3"/>
<line x1="85" y1="250" x2="85" y2="300" stroke="#245b7a" stroke-width="3"/>
<line x1="85" y1="300" x2="485" y2="300" stroke="#245b7a" stroke-width="3"/>
<line x1="485" y1="300" x2="485" y2="250" stroke="#245b7a" stroke-width="3"/>
<circle cx="85" cy="250" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="85" y="257" class="" text-anchor="middle">i</text>
<circle cx="485" cy="250" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="485" y="257" class="" text-anchor="middle">j</text>
<text x="285" y="188" class="" text-anchor="middle">ℓ₁: 10 S, limit 100 A</text>
<text x="285" y="333" class="" text-anchor="middle">ℓ₂: 1 S, limit 100 A</text>
<line x1="650" y1="250" x2="1010" y2="250" stroke="#245b7a" stroke-width="3"/>
<circle cx="650" cy="250" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="650" y="257" class="" text-anchor="middle">i</text>
<circle cx="1010" cy="250" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="1010" y="257" class="" text-anchor="middle">j</text>
<text x="830" y="204" class="" text-anchor="middle">11 S, summed limit 200 A</text>
<text x="830" y="304" class="math" text-anchor="middle">I = 11 ΔU in both models</text>
<text x="40" y="387" class="head" text-anchor="start">At ΔU = 15 V:</text>
<text x="40" y="425" class="" text-anchor="start">I₁ = 150 A &gt; 100 A: FAIL</text>
<text x="40" y="458" class="" text-anchor="start">I₂ = 15 A ≤ 100 A: PASS</text>
<text x="605" y="425" class="" text-anchor="start">I = 165 A ≤ 200 A: PASS</text>
<text x="605" y="458" class="" text-anchor="start">The aggregate check misses the member violation.</text>
<text x="30" y="530" class="" text-anchor="start">Repair for this fixed member set: total-current cap 110 A; recover each member current.</text>
<text x="30" y="565" class="small" text-anchor="start">A declared-limit violation does not predict conductor temperature or melting.</text>
</svg>
