<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<title>Parallel-branch feasible-set geometry</title>
<desc>The naive aggregate admits a voltage drop of 15 V even though the source member limit is 10 V; exact lifting restores the source interval.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.axis{stroke:#17212b;stroke-width:2}.interval{stroke-width:12;stroke-linecap:round}.witness{stroke:#17212b;stroke-width:3;stroke-dasharray:8 6}</style>
<text x="35" y="38" class="title">Parallel-branch feasible-set geometry</text>
<text x="35" y="66" class="sub">Equal terminal admittance does not imply equal member-constrained feasible sets.</text>
<text x="260" y="105" class="head">|ΔU| (V)</text>
<text x="35" y="176" class="head">source members</text>
<line x1="260" y1="170" x2="1080" y2="170" class="axis"/>
<line x1="465.0" y1="170" x2="875.0" y2="170" stroke="#3d78b5" class="interval"/>
<text x="260" y="212" class="small">intersection of individual limits</text>
<line x1="260.0" y1="162" x2="260.0" y2="178" class="axis"/>
<text x="248" y="154" class="small">-20</text>
<line x1="465.0" y1="162" x2="465.0" y2="178" class="axis"/>
<text x="453" y="154" class="small">-10</text>
<line x1="670.0" y1="162" x2="670.0" y2="178" class="axis"/>
<text x="658" y="154" class="small">0</text>
<line x1="875.0" y1="162" x2="875.0" y2="178" class="axis"/>
<text x="863" y="154" class="small">10</text>
<line x1="1080.0" y1="162" x2="1080.0" y2="178" class="axis"/>
<text x="1068" y="154" class="small">20</text>
<text x="35" y="306" class="head">naive aggregate</text>
<line x1="260" y1="300" x2="1080" y2="300" class="axis"/>
<line x1="297.3" y1="300" x2="1042.7" y2="300" stroke="#d8892b" class="interval"/>
<text x="260" y="342" class="small">summed rating: outer relaxation</text>
<line x1="260.0" y1="292" x2="260.0" y2="308" class="axis"/>
<text x="248" y="284" class="small">-20</text>
<line x1="465.0" y1="292" x2="465.0" y2="308" class="axis"/>
<text x="453" y="284" class="small">-10</text>
<line x1="670.0" y1="292" x2="670.0" y2="308" class="axis"/>
<text x="658" y="284" class="small">0</text>
<line x1="875.0" y1="292" x2="875.0" y2="308" class="axis"/>
<text x="863" y="284" class="small">10</text>
<line x1="1080.0" y1="292" x2="1080.0" y2="308" class="axis"/>
<text x="1068" y="284" class="small">20</text>
<text x="35" y="436" class="head">exact lifted</text>
<line x1="260" y1="430" x2="1080" y2="430" class="axis"/>
<line x1="465.0" y1="430" x2="875.0" y2="430" stroke="#477a55" class="interval"/>
<text x="260" y="472" class="small">member constraints recovered</text>
<line x1="260.0" y1="422" x2="260.0" y2="438" class="axis"/>
<text x="248" y="414" class="small">-20</text>
<line x1="465.0" y1="422" x2="465.0" y2="438" class="axis"/>
<text x="453" y="414" class="small">-10</text>
<line x1="670.0" y1="422" x2="670.0" y2="438" class="axis"/>
<text x="658" y="414" class="small">0</text>
<line x1="875.0" y1="422" x2="875.0" y2="438" class="axis"/>
<text x="863" y="414" class="small">10</text>
<line x1="1080.0" y1="422" x2="1080.0" y2="438" class="axis"/>
<text x="1068" y="414" class="small">20</text>
<line x1="977.5" y1="125" x2="977.5" y2="465" class="witness"/>
<text x="945" y="500" class="head">ΔU = 15 V</text>
<text x="35" y="525" class="small">The witness lies inside the summed-rating interval but outside both source and exact-lifted intervals.</text>
</svg>
