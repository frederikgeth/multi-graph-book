<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<title>Complex-plane feasible-set geometry for parallel limits</title>
<desc>The retained member limits form a source disc in the complex voltage-drop plane, while a summed-rating aggregate admits a larger outer disc. A weighted quadratic limit is shown as an ellipse to distinguish the general geometry from the scalar witness.</desc>
<rect width="1200" height="720" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.axis{stroke:#17212b;stroke-width:2}.source{fill:#d9eef8;fill-opacity:.65;stroke:#245b7a;stroke-width:3}.aggregate{fill:#f8e1c4;fill-opacity:.55;stroke:#8a4f13;stroke-width:3;stroke-dasharray:9 6}.ellipse{fill:#e4f4e7;fill-opacity:.6;stroke:#477a55;stroke-width:3}.witness{stroke:#8a3232;stroke-width:3;stroke-dasharray:8 6}.dot{fill:#8a3232}</style>
<text x="35" y="38" class="title" text-anchor="start">Complex-plane feasible-set geometry</text>
<text x="35" y="66" class="sub" text-anchor="start">The scalar witness uses discs; weighted quadratic limits generalize the boundary to ellipses.</text>
<rect x="35" y="95" width="540" height="470" rx="14" class="panel"/>
<rect x="625" y="95" width="540" height="470" rx="14" class="panel"/>
<text x="60" y="130" class="head" text-anchor="start">retained member constraints</text>
<text x="650" y="130" class="head" text-anchor="start">aggregate and weighted limits</text>
<line x1="100" y1="355" x2="510" y2="355" class="axis"/>
<line x1="305" y1="170" x2="305" y2="520" class="axis"/>
<text x="510" y="380" class="small" text-anchor="end">Re z</text>
<text x="315" y="170" class="small" text-anchor="start">Im z</text>
<circle cx="305" cy="355" r="125" class="source"/>
<text x="305" y="218" class="small" text-anchor="middle">q limit: |z| ≤ 1</text>
<text x="305" y="510" class="small" text-anchor="middle">r limit is looser here; intersection is the q disc</text>
<line x1="690" y1="355" x2="1100" y2="355" class="axis"/>
<line x1="895" y1="170" x2="895" y2="520" class="axis"/>
<text x="1100" y="380" class="small" text-anchor="end">Re z</text>
<text x="905" y="170" class="small" text-anchor="start">Im z</text>
<circle cx="895" cy="355" r="190" class="aggregate"/>
<ellipse cx="895" cy="355" rx="155" ry="105" class="ellipse"/>
<text x="895" y="145" class="small" text-anchor="middle">summed rating: |z| ≤ 200/110 ≈ 1.82</text>
<text x="895" y="510" class="small" text-anchor="middle">weighted quadratic limit: an ellipse</text>
<line x1="1020" y1="175" x2="1020" y2="520" class="witness"/>
<circle cx="1020" cy="355" r="7" class="dot"/>
<text x="1032" y="341" class="body" text-anchor="start">15 V witness</text>
<text x="35" y="610" class="small" text-anchor="start">The witness lies inside the aggregate disc but outside the retained member disc; recovery exposes the violated member limit.</text>
<text x="35" y="640" class="small" text-anchor="start">For weighted or coupled limits, the same containment test becomes disc/ellipse or quadratic-form geometry.</text>
</svg>
