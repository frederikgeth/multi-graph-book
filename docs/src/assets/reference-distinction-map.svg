<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900">
<title>Terminology is a distinction map, not only a glossary</title>
<desc>The diagnostic question on each edge tells the reader which apparently similar terms can be substituted—and which cannot.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.empty{fill:#ffffff;stroke:#9aa5ad;stroke-width:2;stroke-dasharray:5 4}.ink{stroke:#17212b;stroke-width:2}.arrow{stroke:#245b7a;stroke-width:3;marker-end:url(#arrow)}
</style>

<text x="35" y="40" class="title" text-anchor="start">Terminology is a distinction map, not only a glossary</text>
<text x="35" y="68" class="sub" text-anchor="start">The diagnostic question on each edge tells the reader which apparently similar terms can be substituted—and which cannot.</text>
<rect x="55" y="130" width="385" height="260" rx="10" class="panel"/>
<text x="75" y="168" class="head" text-anchor="start">bus</text>
<text x="83" y="205" class="body" text-anchor="start">•</text>
<text x="103" y="205" class="body" text-anchor="start">busbar section</text>
<text x="83" y="232" class="body" text-anchor="start">•</text>
<text x="103" y="232" class="body" text-anchor="start">connectivity node</text>
<text x="83" y="259" class="body" text-anchor="start">•</text>
<text x="103" y="259" class="body" text-anchor="start">topological node</text>
<text x="83" y="286" class="body" text-anchor="start">•</text>
<text x="103" y="286" class="body" text-anchor="start">nodal variable group</text>
<text x="83" y="313" class="body" text-anchor="start">•</text>
<text x="103" y="313" class="body" text-anchor="start">reporting bus</text>
<rect x="73" y="335" width="349" height="35" rx="10" class="card"/>
<text x="247" y="358" class="small" text-anchor="middle">which layer and state?</text>
<rect x="500" y="130" width="385" height="220" rx="10" class="panel"/>
<text x="520" y="168" class="head" text-anchor="start">transformation</text>
<text x="528" y="205" class="body" text-anchor="start">•</text>
<text x="548" y="205" class="body" text-anchor="start">projection</text>
<text x="528" y="232" class="body" text-anchor="start">•</text>
<text x="548" y="232" class="body" text-anchor="start">compilation</text>
<text x="528" y="259" class="body" text-anchor="start">•</text>
<text x="548" y="259" class="body" text-anchor="start">normalization</text>
<text x="528" y="286" class="body" text-anchor="start">•</text>
<text x="548" y="286" class="body" text-anchor="start">behavioural reduction</text>
<rect x="518" y="295" width="349" height="35" rx="10" class="card"/>
<text x="692" y="318" class="small" text-anchor="middle">does it solve equations or add objects?</text>
<rect x="945" y="130" width="385" height="220" rx="10" class="panel"/>
<text x="965" y="168" class="head" text-anchor="start">exactness</text>
<text x="973" y="205" class="body" text-anchor="start">•</text>
<text x="993" y="205" class="body" text-anchor="start">exact</text>
<text x="973" y="232" class="body" text-anchor="start">•</text>
<text x="993" y="232" class="body" text-anchor="start">inner</text>
<text x="973" y="259" class="body" text-anchor="start">•</text>
<text x="993" y="259" class="body" text-anchor="start">outer</text>
<text x="973" y="286" class="body" text-anchor="start">•</text>
<text x="993" y="286" class="body" text-anchor="start">scenario-approximate</text>
<rect x="963" y="295" width="349" height="35" rx="10" class="card"/>
<text x="1137" y="318" class="small" text-anchor="middle">which containment is claimed?</text>
<rect x="275" y="500" width="385" height="220" rx="10" class="panel"/>
<text x="295" y="538" class="head" text-anchor="start">state</text>
<text x="303" y="575" class="body" text-anchor="start">•</text>
<text x="323" y="575" class="body" text-anchor="start">connected</text>
<text x="303" y="602" class="body" text-anchor="start">•</text>
<text x="323" y="602" class="body" text-anchor="start">energized</text>
<text x="303" y="629" class="body" text-anchor="start">•</text>
<text x="323" y="629" class="body" text-anchor="start">adjacent</text>
<text x="303" y="656" class="body" text-anchor="start">•</text>
<text x="323" y="656" class="body" text-anchor="start">coupled</text>
<rect x="293" y="665" width="349" height="35" rx="10" class="card"/>
<text x="467" y="688" class="small" text-anchor="middle">which state and matrix?</text>
<rect x="810" y="500" width="385" height="220" rx="10" class="panel"/>
<text x="830" y="538" class="head" text-anchor="start">flow</text>
<text x="838" y="575" class="body" text-anchor="start">•</text>
<text x="858" y="575" class="body" text-anchor="start">commodity flow</text>
<text x="838" y="602" class="body" text-anchor="start">•</text>
<text x="858" y="602" class="body" text-anchor="start">series current</text>
<text x="838" y="629" class="body" text-anchor="start">•</text>
<text x="858" y="629" class="body" text-anchor="start">terminal current</text>
<text x="838" y="656" class="body" text-anchor="start">•</text>
<text x="858" y="656" class="body" text-anchor="start">terminal power</text>
<rect x="828" y="665" width="349" height="35" rx="10" class="card"/>
<text x="1002" y="688" class="small" text-anchor="middle">what is conserved?</text>
<text x="725" y="450" class="head" text-anchor="middle">diagnostic questions</text>
<text x="725" y="475" class="small" text-anchor="middle">are the edges of the map</text>
</svg>
