<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<title>Carson reconciliation: two knobs explain the overhead mismatch</title>
<desc>The same lifted construction is probed at two frequencies and conductor orders; the source matrix is never used as model input.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.warn{fill:#fff3dc;stroke:#a36516;stroke-width:2}.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.ink{stroke:#17212b;stroke-width:2}.ok{fill:#2f6b3b}.red{fill:#8a3232}.amber{fill:#a36516}
</style>

<text x="35" y="40" class="title" text-anchor="start">Carson reconciliation: two knobs explain the overhead mismatch</text>
<text x="35" y="68" class="sub" text-anchor="start">The same lifted construction is probed at two frequencies and conductor orders; the source matrix is never used as model input.</text>
<rect x="45" y="120" width="410" height="560" rx="10" class="panel"/>
<rect x="485" y="120" width="410" height="560" rx="10" class="panel"/>
<rect x="925" y="120" width="510" height="560" rx="10" class="good"/>
<text x="70" y="160" class="head" text-anchor="start">lifted construction</text>
<text x="70" y="192" class="body" text-anchor="start">50 Hz · source order [1,2,3,4]</text>
<text x="70" y="250" class="tiny" text-anchor="start">max error</text>
<text x="70" y="280" class="head" text-anchor="start">0.161 Ω/km</text>
<text x="70" y="345" class="tiny" text-anchor="start">reference</text>
<text x="70" y="370" class="small" text-anchor="start">Australian_overhead Z_abcn</text>
<text x="70" y="430" class="tiny" text-anchor="start">input</text>
<text x="70" y="455" class="small" text-anchor="start">Carson primitive from construction fields</text>
<text x="510" y="160" class="head" text-anchor="start">probe</text>
<text x="510" y="192" class="body" text-anchor="start">60 Hz · order [4,1,2,3]</text>
<text x="510" y="250" class="tiny" text-anchor="start">max error</text>
<text x="510" y="280" class="head" text-anchor="start">4.26e-05 Ω/km</text>
<text x="510" y="345" class="tiny" text-anchor="start">knobs</text>
<text x="510" y="370" class="small" text-anchor="start">frequency + conductor permutation</text>
<text x="510" y="430" class="tiny" text-anchor="start">diagnosis</text>
<text x="510" y="455" class="small" text-anchor="start">reference convention was undeclared</text>
<text x="950" y="160" class="head" text-anchor="start">resolved comparison</text>
<text x="950" y="200" class="body" text-anchor="start">R and X align after both knobs</text>
<text x="950" y="270" class="tiny" text-anchor="start">50 Hz / order [4,1,2,3]</text>
<text x="950" y="293" class="small" text-anchor="start">0.141 Ω/km</text>
<text x="950" y="345" class="tiny" text-anchor="start">60 Hz / order [4,1,2,3]</text>
<text x="950" y="370" class="head" text-anchor="start">4.26e-05 Ω/km</text>
<text x="950" y="445" class="tiny" text-anchor="start">cross-check</text>
<text x="950" y="470" class="small" text-anchor="start">OpenDSSDirect circuit solve + independent</text>
<text x="950" y="490" class="small" text-anchor="start">LinearAlgebra solve agree on voltage/loss rows</text>
<rect x="45" y="720" width="1390" height="105" rx="10" class="warn"/>
<text x="70" y="758" class="head" text-anchor="start">CREDIBILITY BOUNDARY</text>
<text x="70" y="789" class="body" text-anchor="start">The overhead case is reconciled; the companion CS1035 case remains open because its raw construction mapping is unavailable.</text>
</svg>
