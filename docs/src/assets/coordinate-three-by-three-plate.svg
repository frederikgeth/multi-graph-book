<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>One 4×4 source, three different 3×3 views</title>
<desc>The numbers differ because the routes differ: coordinate congruence, neutral Schur elimination, and neutral-deleted phase block.</desc>
<defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a4f13"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.factor{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.asset{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.port{fill:white;stroke:#8a4f13;stroke-width:2}
.jmap{stroke:#245b7a;stroke-width:3;marker-end:url(#arrowBlue)}.fmap{stroke:#8a4f13;stroke-width:3;marker-end:url(#arrowOrange)}
.lambda{stroke:#477a55;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowGreen)}
.wire{stroke:#3d78b5;stroke-width:4}.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:8 6}
.matrix{fill:#eee8f8;stroke:#7856a8;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.warn{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">One 4×4 source, three different 3×3 views</text>
<text x="35" y="68" class="sub" text-anchor="start">The numbers differ because the routes differ: coordinate congruence, neutral Schur elimination, and neutral-deleted phase block.</text>
<rect x="35" y="105" width="1330" height="80" rx="12" class="card"/>
<text x="60" y="138" class="head" text-anchor="start">source</text>
<text x="160" y="138" class="body" text-anchor="start">Pi_abcn series primitive from the checked four-wire fixture</text>
<text x="60" y="166" class="head" text-anchor="start">same entries</text>
<text x="180" y="166" class="body" text-anchor="start">different maps / assumptions → different 3×3 matrices</text>
<rect x="55" y="230" width="284" height="164" rx="12" class="matrix"/>
<text x="197.0" y="255" class="head" text-anchor="middle">Zᵃᵇᶜ  (delete neutral coordinate)</text>
<text x="73" y="286" class="tiny" text-anchor="start">0.42 + j0.84</text>
<text x="161" y="286" class="tiny" text-anchor="start">0.08 + j0.22</text>
<text x="249" y="286" class="tiny" text-anchor="start">0.06 + j0.18</text>
<text x="73" y="319" class="tiny" text-anchor="start">0.08 + j0.22</text>
<text x="161" y="319" class="tiny" text-anchor="start">0.45 + j0.88</text>
<text x="249" y="319" class="tiny" text-anchor="start">0.09 + j0.20</text>
<text x="73" y="352" class="tiny" text-anchor="start">0.06 + j0.18</text>
<text x="161" y="352" class="tiny" text-anchor="start">0.09 + j0.20</text>
<text x="249" y="352" class="tiny" text-anchor="start">0.39 + j0.79</text>
<rect x="490" y="230" width="284" height="164" rx="12" class="matrix"/>
<text x="632.0" y="255" class="head" text-anchor="middle">Zᵖⁿ = T Z Tᵀ  (phase-to-neutral)</text>
<text x="508" y="286" class="tiny" text-anchor="start">0.93 + j0.65</text>
<text x="596" y="286" class="tiny" text-anchor="start">0.57 + j0.01</text>
<text x="684" y="286" class="tiny" text-anchor="start">0.58 + j0.01</text>
<text x="508" y="319" class="tiny" text-anchor="start">0.57 + j0.01</text>
<text x="596" y="319" class="tiny" text-anchor="start">0.92 + j0.65</text>
<text x="684" y="319" class="tiny" text-anchor="start">0.59 + j0.01</text>
<text x="508" y="352" class="tiny" text-anchor="start">0.58 + j0.01</text>
<text x="596" y="352" class="tiny" text-anchor="start">0.59 + j0.01</text>
<text x="684" y="352" class="tiny" text-anchor="start">0.92 + j0.64</text>
<rect x="925" y="230" width="284" height="164" rx="12" class="matrix"/>
<text x="1067.0" y="255" class="head" text-anchor="middle">Zᴷʳᵒⁿ  (neutral Schur complement)</text>
<text x="943" y="286" class="tiny" text-anchor="start">0.45 + j0.75</text>
<text x="1031" y="286" class="tiny" text-anchor="start">0.11 + j0.12</text>
<text x="1119" y="286" class="tiny" text-anchor="start">0.09 + j0.10</text>
<text x="943" y="319" class="tiny" text-anchor="start">0.11 + j0.12</text>
<text x="1031" y="319" class="tiny" text-anchor="start">0.48 + j0.77</text>
<text x="1119" y="319" class="tiny" text-anchor="start">0.12 + j0.11</text>
<text x="943" y="352" class="tiny" text-anchor="start">0.09 + j0.10</text>
<text x="1031" y="352" class="tiny" text-anchor="start">0.12 + j0.11</text>
<text x="1119" y="352" class="tiny" text-anchor="start">0.42 + j0.72</text>
<rect x="55" y="535" width="590" height="110" rx="12" class="warn"/>
<text x="75" y="570" class="head" text-anchor="start">not interchangeable</text>
<text x="75" y="598" class="small" text-anchor="start">Zᵖⁿ is a coordinate map; Zᴷʳᵒⁿ eliminates a variable; Zᵃᵇᶜ simply drops the neutral block.</text>
<rect x="700" y="535" width="645" height="110" rx="12" class="good"/>
<text x="720" y="570" class="head" text-anchor="start">actual phase-to-phase quotient</text>
<text x="720" y="598" class="small" text-anchor="start">P Zᵃᵇᶜ Pᵀ is 2×2, not 3×3: the quotient removes the common mode.</text>
<text x="720" y="622" class="tiny" text-anchor="start">P Zᵃᵇᶜ Pᵀ = [[0.71 + j1.28, -0.34 − j0.64], [-0.34 − j0.64, 0.66 + j1.27]]</text>
<text x="60" y="700" class="body" text-anchor="start">The correct question is not ‘which matrix is the impedance matrix?’ but ‘which coordinates, eliminated variables, and grounding contract produced it?’</text>
<text x="60" y="730" class="small" text-anchor="start">All values are generated from IMPEDANCE-LADDER-001; the plate is a distinction aid, not a new certificate.</text>
</svg>
