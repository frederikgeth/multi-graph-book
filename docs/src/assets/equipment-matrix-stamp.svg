<text x="515" y="521" class="math" text-anchor="middle">Y′ = P Y Pᵀ</text>
<text x="515" y="589" class="math" text-anchor="middle">U′ = P U</text>
<text x="40" y="688" class="small" text-anchor="start">Outlined, shaded cells receive the e1 stamp. Displayed entries are the assembled totals.</text>
<text x="40" y="727" class="small" text-anchor="start">The m diagonal is 3 S because e1 contributes 2 S and e2 contributes 1 S.</text>
