<text x="779.0" y="257" class="math" text-anchor="middle">2</text>
<text x="600" y="314" class="small" text-anchor="start">+2 on its two diagonal positions;</text>
<text x="600" y="344" class="small" text-anchor="start">−2 on its two off-diagonal positions.</text>
<line x1="30" y1="379" x2="1060" y2="379" stroke="#17212b" stroke-width="1"/>
<text x="40" y="423" class="head" text-anchor="start">Y [S] in order (s, m, t)</text>
