<rect x="782" y="576" width="54" height="54" rx="8" fill="#e5f2f8" stroke="#a5afb8" stroke-width="2"/>
<text x="809.0" y="611" class="math" text-anchor="middle">-2</text>
<rect x="836" y="576" width="54" height="54" rx="8" fill="#e5f2f8" stroke="#a5afb8" stroke-width="2"/>
