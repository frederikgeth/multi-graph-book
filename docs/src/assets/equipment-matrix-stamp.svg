<text x="238.0" y="557" class="math" text-anchor="middle">3</text>
<rect x="265" y="522" width="54" height="54" rx="8" fill="white" stroke="#a5afb8" stroke-width="2"/>
<text x="292.0" y="557" class="math" text-anchor="middle">-1</text>
<text x="141" y="611" class="" text-anchor="end">t</text>
