<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>Lowering is a guarded lattice, not a single arrow</title>
<desc>The equation/constraint operator is the faithful boundary; nodal admittance is one optional reduction.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.tiny{font-size:13px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.bus2{fill:#e4f4e7;stroke:#477a55;stroke-width:3}
.wire{stroke:#3d78b5;stroke-width:5}.wire2{stroke:#7856a8;stroke-width:4}
.ground{stroke:#477a55;stroke-width:4}.accent{stroke:#8a4f13;stroke-width:4}
.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:9 7}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.matrix{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.matrix2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">Lowering is a guarded lattice, not a single arrow</text>
<text x="35" y="68" class="sub" text-anchor="start">The equation/constraint operator is the faithful boundary; nodal admittance is one optional reduction.</text>
<rect x="45" y="235" width="290" height="150" rx="12" class="panel"/>
<text x="190" y="275" class="head" text-anchor="middle">source model</text>
<text x="190" y="320" class="body" text-anchor="middle">identified ports, states,</text>
<text x="190" y="345" class="body" text-anchor="middle">limits, decisions</text>
<rect x="375" y="235" width="290" height="150" rx="12" class="panel"/>
<text x="520" y="275" class="head" text-anchor="middle">port / factor</text>
<text x="520" y="320" class="body" text-anchor="middle">typed terminal</text>
<text x="520" y="345" class="body" text-anchor="middle">relations</text>
<rect x="705" y="235" width="290" height="150" rx="12" class="panel"/>
<text x="850" y="275" class="head" text-anchor="middle">equation operator</text>
<text x="850" y="320" class="body" text-anchor="middle">F(z)=0, g(z)≤0,</text>
<text x="850" y="345" class="body" text-anchor="middle">observations, provenance</text>
<rect x="1035" y="235" width="290" height="150" rx="12" class="panel"/>
<text x="1180" y="275" class="head" text-anchor="middle">study target</text>
<text x="1180" y="320" class="body" text-anchor="middle">MNA / tableau</text>
<text x="1180" y="345" class="body" text-anchor="middle">or guarded Y</text>
<line x1="335" y1="310" x2="375" y2="310" class="accent" stroke-width="5"/>
<text x="355.0" y="295" class="tiny" text-anchor="middle">compile</text>
<line x1="665" y1="310" x2="705" y2="310" class="accent" stroke-width="5"/>
<text x="685.0" y="295" class="tiny" text-anchor="middle">compile</text>
<line x1="995" y1="310" x2="1035" y2="310" class="accent" stroke-width="5"/>
<text x="1015.0" y="295" class="tiny" text-anchor="middle">compile</text>
<line x1="850" y1="385" x2="850" y2="535" class="wire2" stroke-width="4"/>
<line x1="850" y1="535" x2="1160" y2="535" class="wire2" stroke-width="4"/>
<line x1="1160" y1="535" x2="1160" y2="385" class="wire2" stroke-width="4"/>
<rect x="885" y="555" width="250" height="110" rx="12" class="good"/>
<text x="1010" y="592" class="head" text-anchor="middle">MNA / tableau</text>
<text x="1010" y="625" class="small" text-anchor="middle">preserves extra variables</text>
<text x="1010" y="648" class="small" text-anchor="middle">and member constraints</text>
<rect x="1165" y="555" width="190" height="110" rx="12" class="bad"/>
<text x="1260" y="592" class="head" text-anchor="middle">Yᴺ</text>
<text x="1260" y="625" class="small" text-anchor="middle">only if guards</text>
<text x="1260" y="648" class="small" text-anchor="middle">and query allow it</text>
<line x1="850" y1="385" x2="1260" y2="555" class="dashed" stroke-width="3"/>
<text x="1080" y="465" class="tiny" text-anchor="middle">optional Lᵧ</text>
<rect x="45" y="105" width="1310" height="80" rx="12" class="card"/>
<text x="70" y="137" class="head" text-anchor="start">belief</text>
<text x="170" y="137" class="body" text-anchor="start">every linear network ends as a Y-bus</text>
<text x="70" y="165" class="head" text-anchor="start">resolution</text>
<text x="190" y="165" class="body" text-anchor="start">the faithful target carries equations, constraints, observations, and provenance; Yᴺ is a guarded view</text>
<rect x="45" y="700" width="1310" height="55" rx="12" class="bad"/>
<text x="70" y="734" class="head" text-anchor="start">blocked shortcut</text>
<text x="230" y="734" class="body" text-anchor="start">ideal voltage source, switching decision, or member limit → do not silently erase the extra variable</text>
</svg>
