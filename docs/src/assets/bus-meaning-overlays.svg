<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>What does bus mean? Four representation overlays</title>
<desc>One substation drawing is shown as a physical busbar section, connectivity node, state-resolved topological node, and compiled bus-branch node.</desc>
<rect width="1400" height="900" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#5f6b76}.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.bar{stroke:#17212b;stroke-width:8}.wire{stroke:#245b7a;stroke-width:4}.open{stroke:#8a3232;stroke-width:4;stroke-dasharray:8 6}.node{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.topo{fill:#e4f4e7;stroke:#477a55;stroke-width:3}.compiled{fill:#f8e1c4;stroke:#8a4f13;stroke-width:3}.switch{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}</style>
<text x="40" y="46" class="title" text-anchor="start">One substation, four meanings of “bus”</text>
<text x="40" y="76" class="sub" text-anchor="start">The geometry is held constant; the retained objects and admissible queries change with the representation.</text>
<rect x="40" y="120" width="635" height="300" rx="14" class="panel"/>
<text x="65" y="158" class="head" text-anchor="start">physical busbar section</text>
<rect x="725" y="120" width="635" height="300" rx="14" class="panel"/>
<text x="750" y="158" class="head" text-anchor="start">connectivity node</text>
<rect x="40" y="500" width="635" height="300" rx="14" class="panel"/>
<text x="65" y="538" class="head" text-anchor="start">topological node under σ</text>
<rect x="725" y="500" width="635" height="300" rx="14" class="panel"/>
<text x="750" y="538" class="head" text-anchor="start">compiled bus–branch node</text>
<line x1="155" y1="300" x2="540" y2="300" class="bar"/>
<line x1="175" y1="225" x2="175" y2="300" class="wire"/>
<line x1="340" y1="300" x2="340" y2="375" class="wire"/>
<line x1="505" y1="225" x2="505" y2="300" class="wire"/>
<text x="175" y="210" class="small" text-anchor="middle">t₁</text>
<text x="340" y="400" class="small" text-anchor="middle">t₂</text>
<text x="505" y="210" class="small" text-anchor="middle">t₃</text>
<text x="340" y="445" class="small" text-anchor="middle">section identity and hardware retained</text>
<line x1="840" y1="300" x2="1225" y2="300" class="bar"/>
<line x1="860" y1="225" x2="860" y2="300" class="wire"/>
<line x1="1025" y1="300" x2="1025" y2="375" class="wire"/>
<line x1="1190" y1="225" x2="1190" y2="300" class="wire"/>
<text x="860" y="210" class="small" text-anchor="middle">t₁</text>
<text x="1025" y="400" class="small" text-anchor="middle">t₂</text>
<text x="1190" y="210" class="small" text-anchor="middle">t₃</text>
<circle cx="860" cy="300" r="10" class="node"/>
<circle cx="1025" cy="300" r="10" class="node"/>
<circle cx="1190" cy="300" r="10" class="node"/>
<text x="1025" y="445" class="small" text-anchor="middle">κ maps terminals to a connectivity node</text>
<line x1="155" y1="680" x2="540" y2="680" class="bar"/>
<line x1="175" y1="605" x2="175" y2="680" class="wire"/>
<line x1="340" y1="680" x2="340" y2="755" class="wire"/>
<line x1="505" y1="605" x2="505" y2="680" class="wire"/>
<text x="175" y="590" class="small" text-anchor="middle">t₁</text>
<text x="340" y="780" class="small" text-anchor="middle">t₂</text>
<text x="505" y="590" class="small" text-anchor="middle">t₃</text>
<ellipse cx="340" cy="680" rx="205" ry="42" class="topo"/>
<text x="340" y="825" class="small" text-anchor="middle">closed switches merge a component for state σ</text>
<line x1="340" y1="638" x2="340" y2="600" class="open"/>
<line x1="840" y1="680" x2="1225" y2="680" class="bar"/>
<line x1="860" y1="605" x2="860" y2="680" class="wire"/>
<line x1="1025" y1="680" x2="1025" y2="755" class="wire"/>
<line x1="1190" y1="605" x2="1190" y2="680" class="wire"/>
<text x="860" y="590" class="small" text-anchor="middle">t₁</text>
<text x="1025" y="780" class="small" text-anchor="middle">t₂</text>
<text x="1190" y="590" class="small" text-anchor="middle">t₃</text>
<rect x="930" y="642" width="190" height="76" rx="12" class="compiled"/>
<text x="1025" y="686" class="body" text-anchor="middle">bus bσ</text>
<text x="1025" y="825" class="small" text-anchor="middle">πσ(κ(t)) + provenance</text>
<text x="40" y="850" class="small" text-anchor="start">A compiled bus count is therefore a state- and purpose-relative result, not a replacement for equipment identity or switch decisions.</text>
</svg>
