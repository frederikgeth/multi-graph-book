<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710">
<title>Same dispatch; scaled or nonunique multipliers</title><desc>Left: for c=50, d=10, beta=1, raw multipliers are 50/alpha, while mapped physical demand sensitivity remains 50. Right: duplicating the unscaled constraint gives all nonnegative multiplier pairs summing to 50, including (0,50), (20,30) and (50,0).</desc>
