<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>A source document becomes a graph only through ordered semantic gates</title>
<desc>The adapter publishes a canonical model, findings, and provenance before any graph quotient or solver view is derived.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker><marker id="arrowo" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a4f13"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.blue{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.orange{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.green{fill:#e5f1e7;stroke:#477a55;stroke-width:2}.red{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}
.axis{stroke:#17212b;stroke-width:2}.grid{stroke:#c7d0d8;stroke-width:1;stroke-dasharray:4 4}
.limit{stroke:#8a3232;stroke-width:2;stroke-dasharray:7 5}.curve1{stroke:#245b7a;stroke-width:3;fill:none}
.curve2{stroke:#8a4f13;stroke-width:3;fill:none}.curve3{stroke:#477a55;stroke-width:3;fill:none}
.curve4{stroke:#7856a8;stroke-width:3;fill:none}.failed{stroke:#8a3232;stroke-width:3;fill:none;stroke-dasharray:8 5}
.arrow{stroke:#245b7a;stroke-width:3;fill:none;marker-end:url(#arrow)}
.arrowo{stroke:#8a4f13;stroke-width:3;fill:none;marker-end:url(#arrowo)}
.arrowg{stroke:#477a55;stroke-width:3;fill:none;marker-end:url(#arrowg)}
</style>

<text x="35" y="40" class="title" text-anchor="start">A source document becomes a graph only through ordered semantic gates</text>
<text x="35" y="68" class="sub" text-anchor="start">The adapter publishes a canonical model, findings, and provenance before any graph quotient or solver view is derived.</text>
<rect x="35" y="105" width="1330" height="575" rx="14" class="panel"/>
<text x="65" y="142" class="head" text-anchor="start">semantic projection</text>
<text x="65" y="177" class="body" text-anchor="start">P : D → (C, F, Π)</text>
<rect x="80" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="170" y="294" class="head" text-anchor="middle">1  schema</text>
<text x="170" y="330" class="small" text-anchor="middle">fields and shapes</text>
<rect x="98" y="362" width="144" height="45" rx="8" class="red"/>
<text x="170" y="390" class="tiny" text-anchor="middle">malformed matrix</text>
<path d="M260 345 L294 345" class="arrow"/>
<rect x="300" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="390" y="294" class="head" text-anchor="middle">2  completeness</text>
<text x="390" y="330" class="small" text-anchor="middle">required subtype data</text>
<rect x="318" y="362" width="144" height="45" rx="8" class="red"/>
<text x="390" y="390" class="tiny" text-anchor="middle">missing terminal map</text>
<path d="M480 345 L514 345" class="arrow"/>
<rect x="520" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="610" y="294" class="head" text-anchor="middle">3  domain</text>
<text x="610" y="330" class="small" text-anchor="middle">plausible values</text>
<rect x="538" y="362" width="144" height="45" rx="8" class="red"/>
<text x="610" y="390" class="tiny" text-anchor="middle">negative rating</text>
<path d="M700 345 L734 345" class="arrow"/>
<rect x="740" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="830" y="294" class="head" text-anchor="middle">4  integrity</text>
<text x="830" y="330" class="small" text-anchor="middle">references and dimensions</text>
<rect x="758" y="362" width="144" height="45" rx="8" class="red"/>
<text x="830" y="390" class="tiny" text-anchor="middle">missing bus</text>
<path d="M920 345 L954 345" class="arrow"/>
<rect x="960" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="1050" y="294" class="head" text-anchor="middle">5  conformance</text>
<text x="1050" y="330" class="small" text-anchor="middle">declared model rules</text>
<rect x="978" y="362" width="144" height="45" rx="8" class="red"/>
<text x="1050" y="390" class="tiny" text-anchor="middle">unsupported connection</text>
<path d="M1140 345 L1174 345" class="arrow"/>
<rect x="1180" y="260" width="180" height="170" rx="12" class="blue"/>
<text x="1270" y="294" class="head" text-anchor="middle">6  readiness</text>
<text x="1270" y="330" class="small" text-anchor="middle">specified study inputs</text>
<rect x="1198" y="362" width="144" height="45" rx="8" class="red"/>
<text x="1270" y="390" class="tiny" text-anchor="middle">missing recovery map</text>
<rect x="150" y="505" width="300" height="90" rx="12" class="green"/>
<text x="300" y="540" class="head" text-anchor="middle">canonical typed model C</text>
<text x="300" y="570" class="small" text-anchor="middle">assets · terminals · factors · states</text>
<rect x="550" y="505" width="300" height="90" rx="12" class="orange"/>
<text x="700" y="540" class="head" text-anchor="middle">findings ledger F</text>
<text x="700" y="570" class="small" text-anchor="middle">declared · derived · inferred · unsupported</text>
<rect x="950" y="505" width="300" height="90" rx="12" class="green"/>
<text x="1100" y="540" class="head" text-anchor="middle">provenance Π</text>
<text x="1100" y="570" class="small" text-anchor="middle">source maps · hashes · recovery</text>
<rect x="35" y="710" width="1330" height="70" rx="10" class="orange"/>
<text x="55" y="740" class="head" text-anchor="start">Ordering rule</text>
<text x="185" y="740" class="body" text-anchor="start">A later graph cannot repair a semantic failure that should have been caught at an earlier gate.</text>
</svg>
