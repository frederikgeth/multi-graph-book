<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<title>Reference orientation and active-power sign are separate</title><desc>For a series-only scalar branch, the stored current reference runs from i to j. Active power entering the branch at terminal i may be positive or negative at different operating points. Reactive power has a separate sign; complex power is not ordered.</desc>
<rect width="1100" height="560" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:20px}.title{font-size:29px;font-weight:bold}.head{font-size:23px;font-weight:bold}.small{font-size:18px}.math{font-family:DejaVu Sans,Arial,sans-serif;font-size:22px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17212b"/></marker></defs>
<text x="30" y="43" class="title" text-anchor="start">Reference orientation and active-power sign are separate</text>
<text x="30" y="80" class="small" text-anchor="start">Scalar series-only branch: no shunts, taps or internal current injection.</text>
<text x="40" y="125" class="head" text-anchor="start">Stored current reference</text>
<text x="590" y="125" class="head" text-anchor="start">Active power at terminal i</text>
<line x1="80" y1="245" x2="430" y2="245" stroke="#245b7a" stroke-width="3"/>
<circle cx="80" cy="245" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="80" y="252" class="" text-anchor="middle">i</text>
<circle cx="430" cy="245" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="430" y="252" class="" text-anchor="middle">j</text>
<line x1="635" y1="245" x2="985" y2="245" stroke="#245b7a" stroke-width="3"/>
<circle cx="635" cy="245" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="635" y="252" class="" text-anchor="middle">i</text>
<circle cx="985" cy="245" r="18" fill="white" stroke="#245b7a" stroke-width="3"/>
<text x="985" y="252" class="" text-anchor="middle">j</text>
<line x1="165" y1="210" x2="355" y2="210" stroke="#17212b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="260" y="188" class="math" text-anchor="middle">I: i → j</text>
<text x="40" y="311" class="" text-anchor="start">Currents entering the branch: I at i, −I at j.</text>
<text x="40" y="347" class="" text-anchor="start">Reversing the reference gives I′ = −I.</text>
<text x="590" y="182" class="math" text-anchor="start">Sᵢ = Uᵢ conj(I) = Pᵢ + jQᵢ</text>
<line x1="710" y1="210" x2="900" y2="210" stroke="#17212b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="790" y="308" class="" text-anchor="middle">Pᵢ &gt; 0: active power enters at i</text>
<line x1="900" y1="350" x2="710" y2="350" stroke="#17212b" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="790" y="389" class="" text-anchor="middle">Pᵢ &lt; 0: active power leaves at i</text>
<text x="30" y="465" class="small" text-anchor="start">The two signs refer to different operating points. Qᵢ has its own sign; do not write Sᵢ &gt; 0.</text>
<text x="30" y="504" class="small" text-anchor="start">With losses, powers entering at the two terminals need not be negatives of one another.</text>
</svg>
