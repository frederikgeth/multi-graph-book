<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>This passive transformer contains a negative reactance</title>
<desc>The negative number belongs to a star coordinate; the positive-semidefinite matrix is the physical guard.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.tiny{font-size:13px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.bus2{fill:#e4f4e7;stroke:#477a55;stroke-width:3}
.wire{stroke:#3d78b5;stroke-width:5}.wire2{stroke:#7856a8;stroke-width:4}
.ground{stroke:#477a55;stroke-width:4}.accent{stroke:#8a4f13;stroke-width:4}
.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:9 7}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.matrix{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.matrix2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">This passive transformer contains a negative reactance</text>
<text x="35" y="68" class="sub" text-anchor="start">The negative number belongs to a star coordinate; the positive-semidefinite matrix is the physical guard.</text>
<rect x="35" y="105" width="600" height="500" rx="12" class="panel"/>
<rect x="765" y="105" width="600" height="500" rx="12" class="panel"/>
<text x="65" y="145" class="head" text-anchor="start">belief: every arm must be positive</text>
<text x="795" y="145" class="head" text-anchor="start">failure: one compiled arm is negative</text>
<circle cx="150" cy="300" r="34" class="bus2"/><text x="150" y="306" class="head" text-anchor="middle">12</text>
<text x="150" y="365" class="body" text-anchor="middle">x12 = 1.0 Ω</text>
<circle cx="320" cy="300" r="34" class="bus2"/><text x="320" y="306" class="head" text-anchor="middle">13</text>
<text x="320" y="365" class="body" text-anchor="middle">x13 = 1.0 Ω</text>
<circle cx="490" cy="300" r="34" class="bus2"/><text x="490" y="306" class="head" text-anchor="middle">23</text>
<text x="490" y="365" class="body" text-anchor="middle">x23 = 3.0 Ω</text>
<text x="335" y="445" class="body" text-anchor="middle">all source short-circuit tests are positive</text>
<text x="335" y="475" class="small" text-anchor="middle">and physically admissible</text>
<rect x="790" y="245" width="140" height="100" rx="12" class="bad"/>
<text x="860" y="285" class="head" text-anchor="middle">z₁</text>
<text x="860" y="320" class="body" text-anchor="middle">-0.5 j Ω</text>
<rect x="985" y="245" width="140" height="100" rx="12" class="good"/>
<text x="1055" y="285" class="head" text-anchor="middle">z₂</text>
<text x="1055" y="320" class="body" text-anchor="middle">1.5 j Ω</text>
<rect x="1180" y="245" width="140" height="100" rx="12" class="good"/>
<text x="1250" y="285" class="head" text-anchor="middle">z₃</text>
<text x="1250" y="320" class="body" text-anchor="middle">1.5 j Ω</text>
<text x="1065" y="405" class="body" text-anchor="middle">the first arm looks non-physical</text>
<rect x="820" y="450" width="480" height="85" rx="12" class="good"/>
<text x="1060" y="483" class="body" text-anchor="middle">guard passes: eigenvalues(Im Zᴮ) = [0.5, 1.5]</text>
<text x="1060" y="512" class="tiny" text-anchor="middle">positive semidefinite, so the compiled relation is admissible</text>
<rect x="35" y="650" width="1330" height="70" rx="12" class="card"/>
<text x="55" y="678" class="head" text-anchor="start">resolution</text>
<text x="180" y="678" class="body" text-anchor="start">which coordinates?  A negative star arm can be a coordinate artifact; the matrix invariant—not componentwise arm positivity—determines admissibility.</text>
</svg>
