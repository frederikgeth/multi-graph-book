<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Translation traps: one card, four recurring mistakes</title>
<desc>Repeat the same diagnostic: what was said, what is testable, and which representation resolves the ambiguity?</desc>
<defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a4f13"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.factor{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.asset{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.port{fill:white;stroke:#8a4f13;stroke-width:2}
.jmap{stroke:#245b7a;stroke-width:3;marker-end:url(#arrowBlue)}.fmap{stroke:#8a4f13;stroke-width:3;marker-end:url(#arrowOrange)}
.lambda{stroke:#477a55;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowGreen)}
.wire{stroke:#3d78b5;stroke-width:4}.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:8 6}
.matrix{fill:#eee8f8;stroke:#7856a8;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.warn{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">Translation traps: one card, four recurring mistakes</text>
<text x="35" y="68" class="sub" text-anchor="start">Repeat the same diagnostic: what was said, what is testable, and which representation resolves the ambiguity?</text>
<rect x="45" y="145" width="650" height="300" rx="12" class="panel"/>
<text x="70" y="183" class="head" text-anchor="start">heterogeneous series merge</text>
<rect x="70" y="205" width="600" height="58" rx="12" class="card"/>
<text x="87" y="239" class="body" text-anchor="start">‘Two sections make one line.’</text>
<text x="70" y="295" class="head" text-anchor="start">testable</text>
<text x="210" y="295" class="small" text-anchor="start">OH-A + UG-B; target construction code = none</text>
<text x="70" y="343" class="head" text-anchor="start">resolving view</text>
<text x="225" y="343" class="small" text-anchor="start">multigraph identities + a generic two-port factor</text>
<rect x="70" y="365" width="600" height="54" rx="12" class="warn"/>
<text x="370" y="398" class="body" text-anchor="middle">reject homogeneous-line closure</text>
<rect x="705" y="145" width="650" height="300" rx="12" class="panel"/>
<text x="730" y="183" class="head" text-anchor="start">external grounding absorption</text>
<rect x="730" y="205" width="600" height="58" rx="12" class="card"/>
<text x="747" y="239" class="body" text-anchor="start">‘Put the ground inside the transformer.’</text>
<text x="730" y="295" class="head" text-anchor="start">testable</text>
<text x="870" y="295" class="small" text-anchor="start">ground asset retained; external-bus guard fails</text>
<text x="730" y="343" class="head" text-anchor="start">resolving view</text>
<text x="885" y="343" class="small" text-anchor="start">asset relation Λ + explicit grounding factor</text>
<rect x="730" y="365" width="600" height="54" rx="12" class="warn"/>
<text x="1030" y="398" class="body" text-anchor="middle">do not erase the return path</text>
<rect x="45" y="510" width="650" height="300" rx="12" class="panel"/>
<text x="70" y="548" class="head" text-anchor="start">three-winding flattening</text>
<rect x="70" y="570" width="600" height="58" rx="12" class="card"/>
<text x="87" y="604" class="body" text-anchor="start">‘The transformer is just a line.’</text>
<text x="70" y="660" class="head" text-anchor="start">testable</text>
<text x="210" y="660" class="small" text-anchor="start">source ports = 3; flattened endpoints = 2</text>
<text x="70" y="708" class="head" text-anchor="start">resolving view</text>
<text x="225" y="708" class="small" text-anchor="start">port–factor model with a 3-port factor</text>
<rect x="70" y="730" width="600" height="54" rx="12" class="warn"/>
<text x="370" y="763" class="body" text-anchor="middle">arity is testable</text>
<rect x="705" y="510" width="650" height="300" rx="12" class="panel"/>
<text x="730" y="548" class="head" text-anchor="start">shared BIM/BFM branch variable</text>
<rect x="730" y="570" width="600" height="58" rx="12" class="card"/>
<text x="747" y="604" class="body" text-anchor="start">‘One W_ij proves the members agree.’</text>
<text x="730" y="660" class="head" text-anchor="start">testable</text>
<text x="870" y="660" class="small" text-anchor="start">aggregate balance passes; consistency residual = 0.158</text>
<text x="730" y="708" class="head" text-anchor="start">resolving view</text>
<text x="885" y="708" class="small" text-anchor="start">identified members + common voltage-drop constraint</text>
<rect x="730" y="730" width="600" height="54" rx="12" class="warn"/>
<text x="1030" y="763" class="body" text-anchor="middle">aggregate balance is not compatibility</text>
<text x="55" y="850" class="small" text-anchor="start">The card is a reusable marginal template: repeat it when a later chapter reuses the same colloquial phrase under a different factor or query.</text>
</svg>
