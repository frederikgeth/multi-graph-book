<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<title>Four exactness classes as observed-set containment</title>
<desc>Four panels compare source and target observed feasible sets: exact equality, inner conservative containment, outer relaxed containment, and scenario agreement only at declared sampled points.</desc>
<rect width="1200" height="850" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.source{fill:#d9eef8;fill-opacity:.9;stroke:#245b7a;stroke-width:3}.target{fill:none;stroke:#8a4f13;stroke-width:3;stroke-dasharray:9 6}.sample{fill:none;stroke:#17212b;stroke-width:2;stroke-dasharray:4 5}.witness{fill:#17212b}.arrow{stroke:#17212b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="44" class="title" text-anchor="start">Exactness is a relation between observed feasible sets</text>
<text x="40" y="72" class="sub" text-anchor="start">The same source and target models can be exact for one observation family and approximate for another.</text>
<rect x="40" y="110" width="540" height="300" rx="14" class="panel"/>
<rect x="620" y="110" width="540" height="300" rx="14" class="panel"/>
<rect x="40" y="470" width="540" height="300" rx="14" class="panel"/>
<rect x="620" y="470" width="540" height="300" rx="14" class="panel"/>
<text x="65" y="145" class="head" text-anchor="start">exact</text>
<text x="65" y="170" class="small" text-anchor="start">observed sets coincide</text>
<ellipse cx="310" cy="270" rx="145" ry="82" class="source"/>
<ellipse cx="310" cy="270" rx="145" ry="82" class="target"/>
<text x="310" y="270" class="body" text-anchor="middle">h(𝓕_M) = ĥ(𝓕_M̂)</text>
<text x="310" y="324" class="small" text-anchor="middle">solid = source   dashed = target</text>
<text x="645" y="145" class="head" text-anchor="start">inner / conservative</text>
<text x="645" y="170" class="small" text-anchor="start">valid target points lift; some source points are excluded</text>
<ellipse cx="890" cy="270" rx="175" ry="96" class="source"/>
<ellipse cx="890" cy="270" rx="108" ry="58" class="target"/>
<text x="890" y="270" class="body" text-anchor="middle">target ⊂ source</text>
<text x="890" y="389" class="small" text-anchor="middle">every target observation has a source witness</text>
<text x="65" y="505" class="head" text-anchor="start">outer / relaxed</text>
<text x="65" y="530" class="small" text-anchor="start">all source points are retained; extra target points may be nonphysical</text>
<ellipse cx="310" cy="630" rx="108" ry="58" class="source"/>
<ellipse cx="310" cy="630" rx="175" ry="96" class="target"/>
<circle cx="433" cy="620" r="6" class="witness"/>
<path d="M438 616 L490 585" class="arrow"/>
<text x="495" y="582" class="small" text-anchor="start">15 V witness</text>
<text x="310" y="741" class="body" text-anchor="middle">source ⊂ target</text>
<text x="645" y="505" class="head" text-anchor="start">scenario approximate</text>
<text x="645" y="530" class="small" text-anchor="start">agreement checked only at the declared sampled points</text>
<ellipse cx="890" cy="635" rx="150" ry="82" class="source"/>
<ellipse cx="930" cy="635" rx="150" ry="82" class="target"/>
<circle cx="825" cy="620" r="5" class="witness"/><circle cx="870" cy="645" r="5" class="witness"/><circle cx="920" cy="610" r="5" class="witness"/>
<text x="890" y="741" class="small" text-anchor="middle">dots: checked samples; no region-wide certificate</text>
<text x="40" y="820" class="small" text-anchor="start">Source set: h(𝓕_M)   ·   target set: ĥ(𝓕_M̂)   ·   every panel assumes the observation map is declared first.</text>
</svg>
