<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690">
<title>Verification state at a glance</title>
<desc>The ledger currently distinguishes self-checks and independent implementations; no claim is externally reviewed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.empty{fill:#ffffff;stroke:#9aa5ad;stroke-width:2;stroke-dasharray:5 4}.ink{stroke:#17212b;stroke-width:2}.arrow{stroke:#245b7a;stroke-width:3;marker-end:url(#arrow)}
</style>

<text x="35" y="40" class="title" text-anchor="start">Verification state at a glance</text>
<text x="35" y="68" class="sub" text-anchor="start">The ledger currently distinguishes self-checks and independent implementations; no claim is externally reviewed.</text>
<rect x="55" y="105" width="1290" height="90" rx="10" class="good"/>
<text x="80" y="140" class="head" text-anchor="start">93 claims</text>
<text x="80" y="171" class="body" text-anchor="start">88 self-checked · 5 independently-implemented · 0 externally-reviewed</text>
