<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<title>One source graph, four views, and three state-conditioned surgeries</title>
<desc>A canonical source graph with identified equipment and ports maps to single-line, port-factor, lowered-edge, and nodal-support views. Three surgery outputs show open-switch zones, a phase-only state, and an unknown-state family.</desc>
<rect width="1400" height="820" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:18px;font-weight:bold}.body{font-size:14px}.small{font-size:13px;fill:#5f6b76}.source{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.view{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.lower{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.surgery{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.arrow{stroke:#17212b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#8a3232;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.edge{stroke:#245b7a;stroke-width:4}.thin{stroke:#477a55;stroke-width:2}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="42" class="title" text-anchor="start">One source graph, four views, and three surgeries</text>
<text x="40" y="70" class="sub" text-anchor="start">Each arrow is typed: it records what survives, what is forgotten, and which state selects the output.</text>
<rect x="40" y="105" width="350" height="300" rx="14" class="panel"/>
<text x="65" y="140" class="head" text-anchor="start">canonical source</text>
<circle cx="120" cy="240" r="30" class="source"/><circle cx="250" cy="180" r="30" class="source"/><circle cx="250" cy="300" r="30" class="source"/>
<line x1="145" y1="225" x2="225" y2="195" class="edge"/><line x1="145" y1="255" x2="225" y2="285" class="edge"/>
<text x="120" y="246" class="head" text-anchor="middle">A</text>
<text x="250" y="186" class="head" text-anchor="middle">B</text>
<text x="250" y="306" class="head" text-anchor="middle">C</text>
<text x="185" y="202" class="small" text-anchor="middle">xfmr₃w</text>
<text x="185" y="288" class="small" text-anchor="middle">switches</text>
<text x="65" y="352" class="body" text-anchor="start">identities + ordered ports + states</text>
<text x="65" y="376" class="small" text-anchor="start">source fibres remain available</text>
<rect x="450" y="105" width="870" height="300" rx="14" class="panel"/>
<text x="475" y="140" class="head" text-anchor="start">typed views</text>
<rect x="490" y="185" width="170" height="100" rx="12" class="view"/><rect x="700" y="185" width="170" height="100" rx="12" class="view"/><rect x="910" y="185" width="170" height="100" rx="12" class="lower"/><rect x="1120" y="185" width="155" height="100" rx="12" class="view"/>
<text x="575" y="220" class="head" text-anchor="middle">single-line</text>
<text x="575" y="247" class="small" text-anchor="middle">quotient</text>
<text x="575" y="270" class="small" text-anchor="middle">partial reverse map</text>
<text x="785" y="220" class="head" text-anchor="middle">port–factor</text>
<text x="785" y="247" class="small" text-anchor="middle">canonical</text>
<text x="785" y="270" class="small" text-anchor="middle">identity retained</text>
<text x="995" y="220" class="head" text-anchor="middle">lowered edges</text>
<text x="995" y="247" class="small" text-anchor="middle">algorithm target</text>
<text x="995" y="270" class="small" text-anchor="middle">fibre required</text>
<text x="1197" y="220" class="head" text-anchor="middle">nodal support</text>
<text x="1197" y="247" class="small" text-anchor="middle">many-to-one</text>
<text x="1197" y="270" class="small" text-anchor="middle">no identity recovery</text>
<path d="M392 220 L440 160 L575 160 L575 180" class="arrow"/><path d="M392 240 L460 170 L785 170 L785 180" class="arrow"/><path d="M392 260 L480 180 L995 180" class="arrow"/><path d="M392 280 L450 200 L1197 200 L1197 180" class="arrow"/>
<path d="M660 335 L450 335" class="dashed"/><path d="M870 335 L450 350" class="dashed"/><path d="M1080 335 L450 365" class="dashed"/>
<text x="535" y="382" class="small" text-anchor="middle">reverse maps only where declared</text>
<rect x="40" y="455" width="1280" height="315" rx="14" class="panel"/>
<text x="65" y="490" class="head" text-anchor="start">state-conditioned surgery outputs</text>
<rect x="90" y="535" width="330" height="170" rx="12" class="surgery"/><rect x="535" y="535" width="330" height="170" rx="12" class="surgery"/><rect x="980" y="535" width="290" height="170" rx="12" class="surgery"/>
<text x="255" y="570" class="head" text-anchor="middle">open_all_switches</text>
<text x="255" y="600" class="body" text-anchor="middle">galvanic zones</text>
<text x="255" y="628" class="small" text-anchor="middle">two components</text>
<text x="255" y="665" class="small" text-anchor="middle">state σ = open</text>
<text x="700" y="570" class="head" text-anchor="middle">phase-only switch</text>
<text x="700" y="600" class="body" text-anchor="middle">coordinate query</text>
<text x="700" y="628" class="small" text-anchor="middle">phase changes; neutral stays</text>
<text x="700" y="665" class="small" text-anchor="middle">member radiality ≠ bus radiality</text>
<text x="1125" y="570" class="head" text-anchor="middle">unknown switch</text>
<text x="1125" y="600" class="body" text-anchor="middle">family return</text>
<text x="1125" y="628" class="small" text-anchor="middle">open and closed cases</text>
<text x="1125" y="665" class="small" text-anchor="middle">diagnostic, not a guess</text>
<path d="M210 405 L210 525" class="arrow"/><path d="M700 405 L700 525" class="arrow"/><path d="M1170 405 L1170 525" class="arrow"/>
<text x="40" y="805" class="small" text-anchor="start">The source object is the semantic anchor; views and surgeries are typed, state-indexed projections with provenance.</text>
</svg>
