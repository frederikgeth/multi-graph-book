<line x1="300" y1="290" x2="440" y2="290" class="edge"/>
<line x1="90" y1="170" x2="300" y2="290" class="fill"/>
<circle cx="90" cy="170" r="25" fill="#d9eef8" stroke="#17212b" stroke-width="2"/>
<text x="90" y="176" text-anchor="middle" class="small">i</text>
<circle cx="230" cy="170" r="25" fill="#d9eef8" stroke="#17212b" stroke-width="2"/>
<text x="230" y="176" text-anchor="middle" class="small">j</text>
<circle cx="370" cy="170" r="25" fill="#d9eef8" stroke="#17212b" stroke-width="2"/>
<text x="370" y="176" text-anchor="middle" class="small">k</text>
<circle cx="300" cy="290" r="25" fill="#d9eef8" stroke="#17212b" stroke-width="2"/>
<text x="300" y="296" text-anchor="middle" class="small">l</text>
<circle cx="440" cy="290" r="25" fill="#d9eef8" stroke="#17212b" stroke-width="2"/>
<text x="440" y="296" text-anchor="middle" class="small">m</text>
<line x1="35" y1="355" x2="510" y2="355" class="grid"/>
<text x="35" y="390" class="title">Structural Jacobian dependency view</text>
<text x="35" y="415" class="small">Rows are equations; columns are variables. Blocks indicate declared dependence.</text>
<text x="110" y="451" text-anchor="end" class="small">KCL i</text>
<text x="110" y="475" text-anchor="end" class="small">KCL j</text>
<text x="110" y="499" text-anchor="end" class="small">KCL k</text>
<text x="110" y="523" text-anchor="end" class="small">KCL l</text>
