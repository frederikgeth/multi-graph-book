<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>A radial bus graph can have cyclic conductor support</title>
<desc>The answer is not a contradiction: the bus graph and the conductor-expanded support graph answer different questions.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.tiny{font-size:13px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.bus2{fill:#e4f4e7;stroke:#477a55;stroke-width:3}
.wire{stroke:#3d78b5;stroke-width:5}.wire2{stroke:#7856a8;stroke-width:4}
.ground{stroke:#477a55;stroke-width:4}.accent{stroke:#8a4f13;stroke-width:4}
.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:9 7}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.matrix{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.matrix2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">A radial bus graph can have cyclic conductor support</text>
<text x="35" y="68" class="sub" text-anchor="start">The answer is not a contradiction: the bus graph and the conductor-expanded support graph answer different questions.</text>
<rect x="35" y="105" width="500" height="540" rx="12" class="panel"/>
<rect x="575" y="105" width="790" height="540" rx="12" class="panel"/>
<text x="65" y="145" class="head" text-anchor="start">belief: radial bus topology</text>
<text x="605" y="145" class="head" text-anchor="start">failure: conductor-expanded support</text>
<line x1="140" y1="365" x2="285" y2="270" class="wire2"/>
<line x1="285" y1="270" x2="430" y2="365" class="wire2"/>
<circle cx="140" cy="365" r="30" class="bus"/><text x="140" y="371" class="head" text-anchor="middle">i</text>
<circle cx="285" cy="270" r="30" class="bus"/><text x="285" y="276" class="head" text-anchor="middle">j</text>
<circle cx="430" cy="365" r="30" class="bus"/><text x="430" y="371" class="head" text-anchor="middle">k</text>
<text x="285" y="490" class="body" text-anchor="middle">tree: μ = 0</text>
<text x="285" y="520" class="small" text-anchor="middle">no physical loop at bus level</text>
<line x1="700" y1="320" x2="930" y2="250" class="wire2" stroke-width="3"/>
<line x1="700" y1="320" x2="930" y2="370" class="wire2" stroke-width="3"/>
<line x1="700" y1="440" x2="930" y2="250" class="wire2" stroke-width="3"/>
<line x1="700" y1="440" x2="930" y2="370" class="wire2" stroke-width="3"/>
<line x1="930" y1="250" x2="1160" y2="320" class="wire2" stroke-width="3"/>
<line x1="930" y1="250" x2="1160" y2="440" class="wire2" stroke-width="3"/>
<line x1="930" y1="370" x2="1160" y2="320" class="wire2" stroke-width="3"/>
<line x1="930" y1="370" x2="1160" y2="440" class="wire2" stroke-width="3"/>
<circle cx="700" cy="320" r="22" class="bus2"/><text x="700" y="326" class="head" text-anchor="middle">ia</text>
<circle cx="700" cy="440" r="22" class="bus2"/><text x="700" y="446" class="head" text-anchor="middle">ib</text>
<circle cx="930" cy="250" r="22" class="bus2"/><text x="930" y="256" class="head" text-anchor="middle">ja</text>
<circle cx="930" cy="370" r="22" class="bus2"/><text x="930" y="376" class="head" text-anchor="middle">jb</text>
<circle cx="1160" cy="320" r="22" class="bus2"/><text x="1160" y="326" class="head" text-anchor="middle">ka</text>
<circle cx="1160" cy="440" r="22" class="bus2"/><text x="1160" y="446" class="head" text-anchor="middle">kb</text>
<text x="930" y="505" class="body" text-anchor="middle">cross-conductor edges create cycles</text>
<text x="930" y="535" class="small" text-anchor="middle">cycle rank of the support graph is positive</text>
<rect x="35" y="680" width="1330" height="70" rx="12" class="card"/>
<text x="55" y="708" class="head" text-anchor="start">resolution</text>
<text x="180" y="708" class="body" text-anchor="start">Bus topology is a tree. The drawn cross-bus conductor support has cycles; it omits within-bus matrix entries.</text>
</svg>
