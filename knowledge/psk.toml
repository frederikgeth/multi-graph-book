[[knowledge]]
id = "PSK-000005"
kind = "modelling-antipattern"
title = "Freezing an adjustable transformer tap does not preserve its decision domain"
scientific_statement = "Replacing an adjustable transformer tap by its fixed start value replaces the source tap domain by a singleton and is generally an inner restriction, not an equivalent decision model; exact parameterized preservation retains the mapped tap identity and complete admissible domain."
scope = "Fixed-frequency transformer factors with a positive scalar ganged winding tap over a declared continuous interval or finite position set, fixed base transfer coefficients, and an explicit source-to-target decision mapping."
evidence_status = "established_result"
does_not_establish = [
  "Freezing an adjustable tap always changes the feasible optimum or operating point.",
  "Matching tap domains alone establishes pointwise transformer equations, tap-dependent losses, controls, network feasible-set equality, objective equality, or solver guarantees.",
  "The initial BMOPFTools continuous-interval contract covers discrete positions, independent per-phase controls, mechanical coupling, or tap-dependent parameters.",
]

