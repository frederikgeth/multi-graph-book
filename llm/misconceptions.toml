[[misconception]]
id = "zero-parameter-means-absent-term"
title = "A parameter currently at zero can be deleted from a reused model"
severity = "critical"
query_patterns = ["parameter zero delete symbolic term", "reuse opf parameter through zero", "parameter update compiled model current residual", "zero parameter coefficient solver reuse"]
tempting_answer = "A parameter term that evaluates to zero can be removed, and another successful solve certifies later updates."
required_qualification = "A zero parameter value is not an identically absent term over a model family. Retain symbolic dependence, compare fresh and reused physical outputs, and check the requested current law. Lost symbolic terms, stale numerical evaluation and edits outside the compiled structure need different remedies. Follow the supported reset workflow, rebuild unrepresented structure, and retain failed scenarios without carrying forward an earlier valid result. The fixed conductance counterexample and pinned execution do not certify arbitrary nonlinear reuse or speed benefits."
safe_shorthand = "Reuse only within the declared parameter family, and validate against the updated physical inputs."
operational_consequence = "A solver can successfully solve deleted or stale equations while the requested current law fails."
mandatory_claim_ids = ["PRACTICE-REUSE-001"]
mandatory_concept_ids = ["state", "factor", "equivalence-exactness-preservation"]
source_paths = ["docs/src/cases/building-and-changing-models.md"]

[misconception.router_scope]
rationale = "Needs parameter, zero/update/reuse and an OPF/solver/term signal."
require_token_groups = ['parameter\w*', 'zero|updat\w*|reus\w*', 'opf|solv\w*|symbolic|compil\w*|coefficient\w*|term\w*|current\w*']

[[misconception]]
id = "delta-coil-currents-are-terminal-currents"
title = "Delta coil currents can be used directly as terminal currents"
severity = "critical"
query_patterns = ["delta coil currents terminal currents", "delta coil current terminal kcl", "delta coil current circulation total power", "terminal kcl total power validate delta coil currents"]
tempting_answer = "A delta load's coil-current array can be inserted directly into terminal KCL, and total power checks every coil."
required_qualification = "For fixed real oriented incidence C, coil voltages are CV and terminal currents are C transpose times coil currents. A three-coil circulation lies in the transpose nullspace and leaves terminal KCL and total power unchanged while individual coil powers change. Check each declared coil law and retain ordered endpoints; two phase terminals define one native delta coil and three define a cycle. This does not validate arbitrary connection implementations or transient physics."
safe_shorthand = "Map coil currents to terminals and verify each coil equation; aggregate agreement alone is insufficient."
operational_consequence = "A terminal-only check can miss an incorrect internal coil operating point or a wrongly assembled current injection."
mandatory_claim_ids = ["LOAD-CONNECTION-002"]
mandatory_concept_ids = ["phase-conductor-sequence-coordinate", "flow-current-power-message", "direction-orientation-hierarchy"]
source_paths = ["docs/src/foundations/load-models-and-decision-dependence.md"]

[misconception.router_scope]
rationale = "Needs delta, coil and current/KCL terms. A phasor-incidence packet cannot answer inrush, energisation or saturation questions."
require_token_groups = ['delta', 'coil\w*', 'current\w*|kcl']
exclude_tokens = 'inrush|transient\w*|energiz\w*|energis\w*|saturat\w*'

[[misconception]]
id = "vanishing-impedance-preserves-ideal-current-sharing"
title = "Tiny impedances and ideal switches have the same current sharing"
severity = "critical"
query_patterns = ["small impedance ideal switch current sharing", "tiny resistance ideal switch", "unique split current ideal switches", "vanishing resistance current selection", "ideal shorts member current limits"]
tempting_answer = "If replacing a small impedance by an ideal switch barely changes voltage, it preserves member currents and ratings."
required_qualification = "The positive scalar resistor family retains resistance-ratio-dependent current sharing as epsilon tends to zero. Replacing both members by ideal shorts removes that selection law: KCL fixes only the sum, so identical limiting voltages can coexist with different member-current feasibility. Keep the limits and current recovery; do not extrapolate this counterexample to a universal regularization theorem."
safe_shorthand = "Small voltage error alone cannot justify idealization when member currents or limits matter."
operational_consequence = "An idealized model may choose a rating-feasible split that the finite-resistance source family cannot attain."
mandatory_claim_ids = ["PRACTICE-SHORT-001"]
mandatory_concept_ids = ["parallel", "rating-limit-constraint", "equivalence-exactness-preservation"]
source_paths = ["docs/src/cases/building-and-changing-models.md"]

[misconception.router_scope]
rationale = "Needs an ideal/small qualifier, an impedance/switch term and a current-sharing term."
require_token_groups = ['ideal|tiny|small|vanish\w*', 'impedance|resistance|resistor\w*|switch\w*|short\w*', 'current\w*|sharing|split|limit\w*']

[[misconception]]
id = "ideal-transformer-is-a-large-admittance"
title = "An ideal transformer is a huge admittance or a small leakage clamped to zero"
severity = "high"
query_patterns = ["ideal transformer huge admittance", "transformer leakage threshold zero", "transformer bordered port finite leakage", "ideal transformer shunts retained", "unity ratio transformer bond neutrals"]
tempting_answer = "Replace ideal or sufficiently small transformer leakage by a huge admittance, or set it to zero and omit the remaining passive branches."
required_qualification = "For the fixed scalar relation CV=zi, the bordered formulation retains finite z through A=y0 C, D=y0^2 z and i=y0 w. Only z=0 gives the ideal constraint. Keep finite magnetizing and grounding shunts exactly once, and specify references; a unity ratio does not create a neutral bond."
safe_shorthand = "A small-leakage representation threshold selects equations; it does not by itself approximate finite leakage as zero."
operational_consequence = "Clamping leakage, losing a shunt, or merging isolated neutrals changes terminal currents and powers; a correct ideal ratio alone cannot detect these failures."
mandatory_claim_ids = ["FORMULATION-PORT-001"]
mandatory_concept_ids = ["factor", "equivalence-exactness-preservation"]
source_paths = ["docs/src/foundations/circuit-formulations-and-lowering.md"]

[misconception.router_scope]
rationale = "Needs a transformer term and an ideal/leakage/bordering term."
require_token_groups = ['transformer\w*|xfmr', 'ideal|leakage|border\w*']

[[misconception]]
id = "power-balance-enforces-kcl-at-zero-voltage"
title = "Power balance enforces KCL even at zero terminal voltage"
severity = "critical"
query_patterns = ["zero voltage power balance", "power balance enforce kcl", "zero neutral power residual", "zero voltage impedance current", "power balance current imbalance"]
tempting_answer = "A small power residual proves that Kirchhoff current balance holds, even at a zero-voltage neutral."
required_qualification = "The complete nodal residuals obey r_S=V conjugate(r_I); division requires V nonzero. At zero voltage the power row loses current information, and small-voltage tolerance amplification must be checked in amperes. Include ground and source reaction currents; total-network power balance can also hide opposite nodal errors."
safe_shorthand = "A nodal power row implies its current row only at nonzero voltage with consistent terminal powers and all current paths accounted for."
operational_consequence = "A zero-voltage or small-voltage terminal may hide a current violation; an arbitrary positive voltage floor changes the admissible domain."
mandatory_claim_ids = ["FORMULATION-ZERO-001"]
mandatory_concept_ids = ["flow-current-power-message", "equivalence-exactness-preservation"]
source_paths = ["docs/src/foundations/circuit-formulations-and-lowering.md", "docs/src/foundations/numerical-consequences.md"]

[misconception.router_scope]
rationale = "KCL at zero voltage needs a power term plus a current/KCL/impedance signal. KCL is not itself a solver-status or VUF question."
require_token_groups = ['power\w*', 'kcl|current\w*|residual\w*|impedance|neutral', 'zero|kcl|impedance|constantz|neutral']
exclude_tokens = 'vuf'

