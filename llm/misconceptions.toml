schema_version = "0.1.0"

[[misconception]]
id = "one-universal-network-graph"
title = "There is one representation-independent network graph"
severity = "high"
query_patterns = ["the network graph", "network graph", "what is the graph of the network", "the topology"]
tempting_answer = "The network is a graph whose buses are nodes and whose equipment is represented by edges."
required_qualification = "A graph claim must name the asset, connectivity, factor, equation-support, or computational representation and the active state relevant to the query."
safe_shorthand = "A bus--branch graph is safe shorthand only after its node, edge, state, and query semantics are declared."
operational_consequence = "Using the wrong graph can erase parallel identity, multi-terminal structure, limits, switching state, or the distinction between physical factors and matrix support."
mandatory_claim_ids = ["VOCAB-BRIDGE-001", "ARCH-SUPPORT-001", "ARCH-VIEW-001", "GRAPH-MULTI-001", "GRAPH-MATRIX-001", "TR-GRAPH-SIMPLIFY-001", "GRAPH-NPORT-001"]
mandatory_concept_ids = ["graph-topology-adjacency", "element-edge-relation"]
source_paths = ["docs/src/start/one-network-five-languages.md", "docs/src/foundations/representation-taxonomy.md", "docs/src/foundations/multigraphs-for-modelers.md", "docs/src/foundations/two-level-topology-and-nodal-projection.md"]

[[misconception]]
id = "self-loop-is-a-shunt-or-circuit-loop"
title = "A graph self-loop, circuit loop, and nodal diagonal are interchangeable"
severity = "high"
query_patterns = ["self-loop", "self loop", "pi section", "self loop in circuit", "circuit self-loop", "pi section same node", "pi section self loop", "graph loop ybus", "diagonal admittance loop"]
tempting_answer = "A self-loop is just a shunt or an ordinary circuit branch, so it can be deleted or stamped without checking the representation."
required_qualification = "Distinguish the source multigraph loop, the loopless circuit specialization, loopy-Laplacian matrix convention, and the guarded terminal-map compilation of a fixed linear pi factor."
safe_shorthand = "A graph self-loop has zero signed incidence under the declared convention; a shunt or collapsed factor contributes only after its constitutive relation and reference are assembled."
operational_consequence = "Confusing these layers can erase grounding effects, branch observations, shunts, coupling, or source provenance and can produce incompatible nodal models."
mandatory_claim_ids = ["GRAPH-SELF-LOOP-001", "GRAPH-LOOPY-001", "GRAPH-PI-COLLAPSE-001"]
mandatory_concept_ids = ["graph-topology-adjacency", "factor", "nodal-operator-alias"]
source_paths = ["docs/src/foundations/multigraphs-for-modelers.md", "docs/src/foundations/earth-ground-models.md", "docs/src/foundations/circuit-formulations-and-lowering.md"]

[[misconception]]
id = "loads-generators-fixed-graph-membership"
title = "Loads and generators either always belong to the graph or never do"
severity = "high"
query_patterns = ["do loads belong to the graph", "do generators belong to the graph", "loads and generators", "separate injections", "put loads in ybus", "fold load into ybus", "constant admittance load", "load in component graph", "iterative power flow", "linear matrix device", "linearized device contribution"]
tempting_answer = "Loads and generators are nodal injections and therefore are separate from the network graph and Ybus."
required_qualification = "Source-model ownership and study-formulation placement are distinct: a load or generator may remain an attached factor while a declared constant-admittance, Norton, or linearized component is assembled into a nodal operator for a particular formulation or iteration."
safe_shorthand = "Calling a device an injection is safe only when the study formulation, retained nonlinear part, state dependence, and provenance of any assembled linear part are explicit."
operational_consequence = "Treating formulation placement as intrinsic graph membership produces incompatible Ybus definitions, obscures model updates, and can change load-flow, initialization, short-circuit, and decision semantics."
mandatory_claim_ids = ["FORMULATION-Y-SPLIT-001", "ARCH-NODAL-001", "LOAD-DECISION-001"]
mandatory_concept_ids = ["graph-topology-adjacency", "factor", "nodal-operator-alias"]
source_paths = ["docs/src/foundations/multigraphs-for-modelers.md", "docs/src/foundations/circuit-formulations-and-lowering.md", "docs/src/foundations/load-models-and-decision-dependence.md"]

[[misconception]]
id = "nodal-operator-is-source-network"
title = "The nodal admittance matrix uniquely is the network"
severity = "high"
query_patterns = ["ybus is the network", "nodal admittance matrix represents the network", "recover network from ybus", "reconstruct source asset graph", "sparse ybus export", "electrically complete ybus equivalent"]
tempting_answer = "Ybus completely represents the electrical network."
required_qualification = "A declared nodal operator represents an assembled linear relation in fixed coordinates; assembly is generally non-injective, its support is a derived simple graph, and it can omit factor identity, member limits, controls, provenance, and variables required by the query."
safe_shorthand = "Ybus may be called the network matrix, not the unique source network, under a fixed model class and coordinate order."
operational_consequence = "Inferring assets, member constraints, or a unique graph from the matrix can create false topology and decision claims."
mandatory_claim_ids = ["ARCH-NODAL-001", "ARCH-SUPPORT-001", "FORMULATION-NODAL-002"]
mandatory_concept_ids = ["nodal-operator-alias", "graph-topology-adjacency"]
source_paths = ["docs/src/foundations/two-level-topology-and-nodal-projection.md", "docs/src/foundations/circuit-formulations-and-lowering.md"]

[[misconception]]
id = "parallel-admittance-implies-decision-equivalence"
title = "Parallel admittances and ratings can simply be summed"
severity = "critical"
query_patterns = ["combine parallel lines", "sum parallel ratings", "equivalent parallel branch", "parallel circuits opf", "total mva rating"]
tempting_answer = "Replace parallel branches by one branch with summed admittance and summed rating."
required_qualification = "Summed admittance preserves the unconstrained terminal relation, but a summed member rating can be an outer relaxation of the member-constrained feasible set unless member observations and limits are recoverable or provably redundant."
safe_shorthand = "Summed admittance is safe for the declared unconstrained terminal equation, not automatically for member-constrained decisions."
operational_consequence = "The aggregate can admit dispatch or loading decisions that overload a source member."
mandatory_claim_ids = ["TR-PAR-001", "TR-PAR-002", "TR-PAR-003"]
mandatory_concept_ids = ["parallel", "rating-limit-constraint", "equivalence-exactness-preservation"]
source_paths = ["docs/src/start/first-failure-parallel-branches.md"]

[[misconception]]
id = "radial-is-representation-independent"
title = "A radial feeder is cycle-free without qualification"
severity = "high"
query_patterns = ["is this feeder radial", "radial means no cycles", "tree network"]
tempting_answer = "A radial feeder is a tree and therefore contains no cycles."
required_qualification = "Radiality and cycle rank belong to a named active graph: a tree-shaped simple bus projection may hide a line-identity cycle from parallel members, and inventory and active-state graphs can differ."
safe_shorthand = "Radial feeder is safe shorthand only when the representation and active state are understood."
operational_consequence = "The shortcut can erase outage redundancy, member switching choices, and cycle-space dimensions used by algorithms."
mandatory_claim_ids = ["GRAPH-CYCLE-001", "TR-GRAPH-001", "TR-GRAPH-ACTIVE-001"]
mandatory_concept_ids = ["cycle-radial-tree", "parallel"]
source_paths = ["docs/src/foundations/multigraphs-for-modelers.md", "docs/src/foundations/cycles-parallelism-radiality.md", "docs/src/start/five-bus-cycle-spaces.md"]

[[misconception]]
id = "kron-reduction-preserves-everything"
title = "Exact Kron reduction makes a fully equivalent network"
severity = "critical"
query_patterns = ["is kron reduction exact", "kron equivalent network", "eliminate internal buses", "delete kron eliminated components", "reduced matrix model store", "schur complement reduction", "schur-complement network reduction", "metadata reverse map", "internal equipment limits", "protection quantities"]
tempting_answer = "Kron reduction is exact, so the reduced network is equivalent to the original."
required_qualification = "Kron reduction can preserve a declared linear boundary relation under its algebraic guards; it can create fill and still require recovery maps for internal quantities, state-dependent factors, limits, decisions, and provenance."
safe_shorthand = "Exact Kron reduction is safe only when the exactness object, domain, retained observations, and recovery obligations are named."
operational_consequence = "A boundary-exact reduction can still lose internal feasibility, protection quantities, asset meaning, or validity away from its calibration domain."
mandatory_claim_ids = ["PRESERVE-001", "TR-KRON-002", "TR-KRON-FIVE-002"]
mandatory_concept_ids = ["equivalence-exactness-preservation", "transformation-family"]
source_paths = ["docs/src/foundations/preservation-contracts.md", "docs/src/transformations/kron-ward-opti-kron.md"]

[[misconception]]
id = "transposition-implies-positive-sequence-exactness"
title = "Transposition alone makes a positive-sequence model exact"
severity = "critical"
query_patterns = ["transposed line positive sequence", "positive sequence exact", "positive sequence equivalent", "transposed network", "transposed line model", "sequence invariant subspace", "balanced equivalent"]
tempting_answer = "A transposed three-phase line can be represented exactly by its positive-sequence circuit."
required_qualification = "Exact collapse requires compatible terminals, sequence-invariant constitutive matrices and grounding, balanced boundary data, compatible device closure, and phase-symmetric constraints and decisions; transposition alone does not establish those conditions."
safe_shorthand = "Positive-sequence modelling is exact only on the declared invariant subspace under the complete collapse contract."
operational_consequence = "The shortcut can suppress sequence coupling, neutral or grounding behaviour, unbalance, and phase-selective limits or decisions."
mandatory_claim_ids = ["COLLAPSE-001", "COLLAPSE-002"]
mandatory_concept_ids = ["phase-conductor-sequence-coordinate", "equivalence-exactness-preservation"]
source_paths = ["docs/src/foundations/when-general-model-collapses.md"]

[[misconception]]
id = "ground-neutral-reference-are-one-node"
title = "Ground, neutral, earth, and voltage reference are the same node"
severity = "critical"
query_patterns = ["ground node", "neutral is ground", "earth reference node", "remove neutral node"]
tempting_answer = "Ground and neutral can be represented by the zero-voltage reference node."
required_qualification = "Physical earth, neutral conductors, grounding impedances or assets, and gauge references are distinct objects; any identification or elimination must declare the earth-return class, grounding points, retained observations, and recovery requirements."
safe_shorthand = "Ground node is safe only when the physical and mathematical objects intentionally identified by that model are stated."
operational_consequence = "Conflation can erase neutral voltage and current, earth-return paths, grounding-device state, protection quantities, and limits."
mandatory_claim_ids = ["GROUND-SCOPE-001", "GROUND-SCOPE-002"]
mandatory_concept_ids = ["ground-neutral-reference", "object-node-interface"]
source_paths = ["docs/src/foundations/earth-ground-models.md", "docs/src/start/one-network-five-languages.md"]

[[misconception]]
id = "terminal-equivalence-implies-opf-equivalence"
title = "Equal terminal equations imply equal optimization decisions"
severity = "critical"
query_patterns = ["equivalent circuit preserves opf", "terminal equivalent optimization", "same terminal behavior same decisions", "terminal equation regression test", "model reduction for optimization", "network equivalent preserve opf", "planning decisions"]
tempting_answer = "If two models have the same terminal equations, they are interchangeable in optimization."
required_qualification = "Decision equivalence is indexed by the admissible domain, observations, constraints, objective, discrete choices, and recovery map; terminal equality alone does not establish equality of constrained feasible observable sets."
safe_shorthand = "Equivalent is safe only when the preservation contract names the relevant exactness object."
operational_consequence = "An apparently exact equivalent can admit infeasible source decisions, hide binding member constraints, or change objective values."
mandatory_claim_ids = ["PRESERVE-001", "TR-PAR-001", "TR-PAR-002"]
mandatory_concept_ids = ["equivalence-exactness-preservation", "rating-limit-constraint"]
source_paths = ["docs/src/foundations/preservation-contracts.md", "docs/src/start/first-failure-parallel-branches.md"]

[[misconception]]
id = "mutual-coupling-is-an-ordinary-parallel-network"
title = "Mutually coupled sections and their lattice are ordinary physical parallel branches"
severity = "critical"
query_patterns = ["mutually coupled lines", "different voltage parallel lines", "shared impedance matrix", "share poles and a mutual impedance", "parallel graph edges mutual impedance", "lattice edges real wires", "coupling group", "joint primitive", "equivalent lattice", "six edge lattice", "cross voltage edge", "mutual coupling opf", "generated lattice conductor"]
tempting_answer = "Treat the coupled lines as ordinary parallel branches and use every edge of the equivalent lattice as a physical line in subsequent studies."
required_qualification = "Physical co-location, graph parallelism, and electromagnetic coupling are distinct. The canonical model retains identified line sections plus coupling records assembled into a joint primitive; an invertible reciprocal fixed-linear scalar primitive admits a generated lattice for its terminal equation, but the lattice edges are not conductors and the certificate does not establish limit, state, protection, or decision equivalence."
safe_shorthand = "Equivalent lattice is safe only as a generated fixed-linear equation realization with source-current recovery, provenance, and a separate study-preservation contract."
operational_consequence = "Treating generated signed cross edges as assets can create false galvanic connectivity, attach limits to fictitious conductors, violate solver weight assumptions, and admit source-infeasible operating decisions."
mandatory_claim_ids = ["COUPLED-CORRIDOR-001", "COUPLED-CORRIDOR-002"]
mandatory_concept_ids = ["mutual-coupling-relation", "parallel", "equivalence-exactness-preservation"]
source_paths = ["docs/src/cases/coupled-multivoltage-corridor.md", "docs/src/foundations/cycles-parallelism-radiality.md", "docs/src/foundations/preservation-contracts.md"]

[[misconception]]
id = "solver-termination-implies-validated-solution"
title = "Successful solver termination proves the returned solution is scientifically valid"
severity = "critical"
query_patterns = ["solver says optimal", "locally solved means feasible", "solver success validates solution", "termination status proof", "trust optimal solution", "successful opf result", "opf converged successfully", "solver converged so correct", "accept solved result"]
tempting_answer = "The solver returned a successful or optimal status, so the result satisfies the model and is valid for the study."
required_qualification = "Termination status is algorithm evidence only; independently validate the returned numeric values, relevant equations, bounds, residuals, recovery obligations, and the actual local or global optimality guarantee before making a scientific conclusion."
safe_shorthand = "Solved is safe shorthand only when the required independent validation dimensions and optimality level are stated."
operational_consequence = "The shortcut can accept non-finite values, violated voltage or equipment limits, nonzero model residuals, incomplete result extraction, or a local point presented as a global decision."
mandatory_claim_ids = ["NUMERICAL-001", "NUMERICAL-004"]
mandatory_concept_ids = ["state", "rating-limit-constraint"]
source_paths = ["docs/src/foundations/numerical-consequences.md"]

[[misconception]]
id = "wye-delta-share-nominal-voltage-base"
title = "WYE and DELTA voltage-dependent loads can reuse the same numeric nominal voltage"
severity = "critical"
query_patterns = ["wye and delta same nominal voltage", "delta load v_nom", "load kv line to line or line to neutral", "copy bus voltage into load v_nom", "230 v delta zip load", "400 v delta load on 230 v bus", "sqrt3 load voltage base", "line-to-line load nominal anchor", "phase-to-neutral load base", "wrong load voltage base"]
tempting_answer = "Use the bus nominal voltage as v_nom for both WYE and DELTA loads because they are connected to the same bus."
required_qualification = "The load anchor belongs to its terminal coordinate: WYE uses phase-to-neutral voltage and DELTA uses line-to-line voltage. On a nominal three-phase system those bases differ by sqrt(3), and reusing one numeric value changes the normalized voltage-dependent load law."
safe_shorthand = "Bus voltage is a safe load anchor only after the connection coordinate and line-to-line or phase-to-neutral basis are named."
operational_consequence = "A wrong anchor changes constant-current, constant-impedance, ZIP, or exponential demand away from the nominal point and can alter voltage, loading, feasibility, and decisions."
mandatory_claim_ids = ["LOAD-BASE-001", "LOAD-CONNECTION-001"]
mandatory_concept_ids = ["normalization", "phase-conductor-sequence-coordinate", "factor"]
source_paths = ["docs/src/foundations/load-models-and-decision-dependence.md"]

[[misconception]]
id = "fixed-tap-snapshot-preserves-adjustable-transformer"
title = "A transformer fixed at its start tap preserves an adjustable-tap model"
severity = "critical"
query_patterns = ["freeze transformer tap", "fixed tap equivalent to adjustable tap", "use transformer start tap", "remove tap variable", "drop tap bounds", "tap_min tap_max", "fixed tap snapshot", "transformer tap decision domain", "replace adjustable transformer", "tap optimization preprocessing"]
tempting_answer = "Replace the adjustable transformer by a fixed transformer at its starting tap; it has the same parameters at the initial operating point."
required_qualification = "A start value is an initial point, not the admissible decision domain. Freezing it replaces the source interval or finite position set by a singleton and is generally an inner restriction unless the original domain is already a singleton or the removed choices are proved irrelevant for the declared study."
safe_shorthand = "A fixed tap is safe only as a pointwise snapshot; decision preservation requires the mapped tap identity and complete domain, followed by separate equation, constraint, objective, recovery, and control checks."
operational_consequence = "The shortcut can remove feasible voltage-control actions, change load service or loss objectives, conceal the source optimum, and present a restricted problem as an equivalent transformer model."
mandatory_claim_ids = ["TR-XFMR-005", "TR-XFMR-006"]
mandatory_concept_ids = ["state", "rating-limit-constraint", "equivalence-exactness-preservation", "transformation-family"]
source_paths = ["docs/src/transformations/parameterized-transformer-tap-decisions.md", "docs/src/cases/transformer-tap-ac-decision.md"]
