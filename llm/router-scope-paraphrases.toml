schema_version = "0.1.0"
purpose = """Synthetic paraphrases that probe contract-router scope gates: in-scope wording the gates should admit, and \
out-of-scope wording they must not route to a scoped contract. Written by the author/agent, not human-validated. \
The first measurement was recorded before any gate was changed against it; later gate edits must not edit these \
cases to fit, and new cases should be added rather than rewritten. Not a deployment error-rate estimate."""

# expected_route: the contract that should be top-1. Omit for out-of-scope cases.
# forbidden_routes: contracts that must not be top-1, because their packets
# cannot answer the question. A forbidden hit fails the check.

# Constant PF versus capability clipping.
[[case]]
case_id = "RSCOPE-CPF-01"
question = "Under a fixed power factor setpoint, can I just cap reactive power at its limit?"
expected_route = "constant-pf-capability-is-clipping"

[[case]]
case_id = "RSCOPE-CPF-02"
question = "If an inverter runs at constant PF and hits qmin, is it fine to saturate Q there and keep P?"
expected_route = "constant-pf-capability-is-clipping"

[[case]]
case_id = "RSCOPE-CPF-03"
question = "Is limiting Q to the capability bound compatible with a constant power factor law at the same P?"
expected_route = "constant-pf-capability-is-clipping"

[[case]]
case_id = "RSCOPE-CPF-04"
question = "With a constant power factor control, what happens if I clip Q to the capability limit during a fault transient?"
forbidden_routes = ["constant-pf-capability-is-clipping", "weighted-pf-residual-certifies-ratio"]

