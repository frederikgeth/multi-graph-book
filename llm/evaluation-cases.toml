schema_version = "0.1.0"

# Each misconception is exercised in three professional languages. The
# required evidence is intentionally identical across those renderings.

[[case]]
case_id = "EVAL-GRAPH-STUDENT"
audience = "student"
question = "What is the graph of a power network—are buses nodes and lines edges?"
misconception_id = "one-universal-network-graph"
required_claim_ids = ["VOCAB-BRIDGE-001", "ARCH-SUPPORT-001", "ARCH-VIEW-001", "GRAPH-MULTI-001", "GRAPH-MATRIX-001", "TR-GRAPH-SIMPLIFY-001", "GRAPH-NPORT-001"]
required_concept_ids = ["graph-topology-adjacency", "element-edge-relation"]
required_answer_elements = ["name the representation and active state", "distinguish physical factors from derived graph edges"]
forbidden_simplifications = ["there is one canonical graph for every question"]

[[case]]
case_id = "EVAL-GRAPH-SOFTWARE"
audience = "software_engineer"
question = "Which graph should my network API expose as the graph field?"
misconception_id = "one-universal-network-graph"
required_claim_ids = ["VOCAB-BRIDGE-001", "ARCH-SUPPORT-001", "ARCH-VIEW-001", "GRAPH-MULTI-001", "GRAPH-MATRIX-001", "TR-GRAPH-SIMPLIFY-001", "GRAPH-NPORT-001"]
required_concept_ids = ["graph-topology-adjacency", "element-edge-relation"]
required_answer_elements = ["use typed or separately named graph views", "record the projection and forgotten information"]
forbidden_simplifications = ["serialize one adjacency list as the complete network"]

[[case]]
case_id = "EVAL-GRAPH-POWER"
audience = "power_engineer"
question = "For a feeder study, what exactly should we mean by the network graph?"
misconception_id = "one-universal-network-graph"
required_claim_ids = ["VOCAB-BRIDGE-001", "ARCH-SUPPORT-001", "ARCH-VIEW-001", "GRAPH-MULTI-001", "GRAPH-MATRIX-001", "TR-GRAPH-SIMPLIFY-001", "GRAPH-NPORT-001"]
required_concept_ids = ["graph-topology-adjacency", "element-edge-relation"]
required_answer_elements = ["name bus, asset, factor, or support view", "state switching status and study purpose"]
forbidden_simplifications = ["the one-line topology is sufficient for every study"]

[[case]]
case_id = "EVAL-YSPLIT-STUDENT"
