<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<title>Parallel redundancy certificate geometry and decision gap</title>
<desc>Left: a retained current-disc radius maps through a recovered row norm into a candidate rating. Right: exact and naive served fractions for two multiconductor parallel cases.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:28px;font-weight:bold}
.sub{font-size:16px;fill:#5f6b76}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.grid{stroke:#c7d0d8;stroke-width:1;stroke-dasharray:4 4}
.axis{stroke:#17212b;stroke-width:2}.retained{fill:#d9eef8;stroke:#245b7a;stroke-width:3}
.candidate{fill:none;stroke:#8a3232;stroke-width:3;stroke-dasharray:8 5}.map{stroke:#477a55;stroke-width:3;fill:none;marker-end:url(#arrow)}
.exact{fill:#477a55}.naive{fill:#8a3232}.limit{stroke:#8a3232;stroke-width:2;stroke-dasharray:6 5}
</style>

<text x="35" y="40" class="title" text-anchor="start">A certificate has geometry—and a decision consequence</text>
<text x="35" y="68" class="sub" text-anchor="start">The row-norm bound is the bridge from retained member limits to a safe deletion; the bar chart shows what goes wrong when that bridge is replaced by a summed limit.</text>
<rect x="35" y="105" width="650" height="620" rx="14" class="panel"/>
<rect x="715" y="105" width="650" height="620" rx="14" class="panel"/>
<text x="65" y="142" class="head" text-anchor="start">A. Retained discs and candidate row</text>
<text x="745" y="142" class="head" text-anchor="start">B. Served-fraction consequence</text>
<line x1="50" y1="420" x2="550" y2="420" class="axis"/>
<line x1="300" y1="170" x2="300" y2="670" class="axis"/>
<circle cx="300" cy="420" r="180.0" class="candidate"/>
<circle cx="300" cy="420" r="61.6" class="retained"/>
<text x="474.0" y="232.0" class="small" text-anchor="end">candidate rating 0.72 p.u.</text>
<text x="369.5625" y="425" class="small" text-anchor="start">retained row-norm bound 0.1773 p.u.</text>
<text x="310" y="158" class="small" text-anchor="start">Im</text>
<text x="530" y="448" class="small" text-anchor="start">Re</text>
<path d="M335 385 C395 325 470 285 520 235" class="map"/>
<text x="470" y="230" class="body" text-anchor="start">K = A_l2 A_l1^-1</text>
<text x="470" y="254" class="small" text-anchor="start">row norm certifies every candidate component</text>
<rect x="75" y="605" width="560" height="78" rx="10" fill="#e5f1e7" stroke="#477a55" stroke-width="2"/>
<text x="95" y="637" class="head" text-anchor="start">Safe deletion</text>
<text x="215" y="633" class="body" text-anchor="start">0.1773 &lt; 0.72, so member-2 limits are implied</text>
<text x="215" y="658" class="small" text-anchor="start">by the retained member-1 current discs (fixed map).</text>
<line x1="815" y1="600.0" x2="1315" y2="600.0" class="grid"/>
<text x="805" y="604.0" class="tiny" text-anchor="end">0</text>
<line x1="815" y1="502.5" x2="1315" y2="502.5" class="grid"/>
<text x="805" y="506.5" class="tiny" text-anchor="end">0.5</text>
<line x1="815" y1="405.0" x2="1315" y2="405.0" class="grid"/>
<text x="805" y="409.0" class="tiny" text-anchor="end">1</text>
<line x1="815" y1="307.5" x2="1315" y2="307.5" class="grid"/>
<text x="805" y="311.5" class="tiny" text-anchor="end">1.5</text>
<line x1="815" y1="210.0" x2="1315" y2="210.0" class="grid"/>
<text x="805" y="214.0" class="tiny" text-anchor="end">2</text>
<line x1="815" y1="210" x2="815" y2="600" class="axis"/>
<line x1="815" y1="600" x2="1315" y2="600" class="axis"/>
<text x="1065.0" y="642" class="small" text-anchor="middle">served fraction alpha</text>
<text x="819" y="195" class="small" text-anchor="start">load served</text>
<rect x="850" y="480.3" width="36" height="119.7" class="exact"/>
<text x="868" y="472.291294" class="tiny" text-anchor="middle">0.6139</text>
<text x="868" y="620" class="tiny" text-anchor="middle">exact</text>
<rect x="904" y="392.7" width="36" height="207.3" class="naive"/>
<text x="922" y="384.6987565" class="tiny" text-anchor="middle">1.0631</text>
<text x="922" y="620" class="tiny" text-anchor="middle">naive sum</text>
<text x="895" y="672" class="body" text-anchor="middle">multiconductor</text>
<rect x="1070" y="380.2" width="36" height="219.8" class="exact"/>
<text x="1088" y="372.1505845" class="tiny" text-anchor="middle">1.1274</text>
<text x="1088" y="620" class="tiny" text-anchor="middle">exact</text>
<rect x="1124" y="247.9" width="36" height="352.1" class="naive"/>
<text x="1142" y="239.86547050000001" class="tiny" text-anchor="middle">1.8058</text>
<text x="1142" y="620" class="tiny" text-anchor="middle">naive sum</text>
<text x="1115" y="672" class="body" text-anchor="middle">four-wire</text>
<line x1="1160" y1="655" x2="1190" y2="655" class="exact"/>
<text x="1200" y="660" class="small" text-anchor="start">exact certified</text>
<line x1="1160" y1="680" x2="1190" y2="680" class="naive"/>
<text x="1200" y="685" class="small" text-anchor="start">naive aggregate</text>
<rect x="745" y="620" width="590" height="70" rx="10" fill="#f8e1c4" stroke="#8a4f13" stroke-width="2"/>
<text x="765" y="650" class="head" text-anchor="start">Interpretation</text>
<text x="885" y="646" class="small" text-anchor="start">The naive model is smaller, but it enlarges the feasible set</text>
<text x="885" y="670" class="small" text-anchor="start">by replacing member limits with an uncertified sum.</text>
</svg>
