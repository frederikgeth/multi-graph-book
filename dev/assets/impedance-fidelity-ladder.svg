<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<title>Impedance fidelity is a guarded transformation path</title>
<desc>Each arrow adds a declared approximation or coordinate change; the matrix alone is not the complete electrical factor.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker><marker id="arrowo" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a4f13"/></marker><marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.blue{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.orange{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.green{fill:#e5f1e7;stroke:#477a55;stroke-width:2}.red{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}
.axis{stroke:#17212b;stroke-width:2}.grid{stroke:#c7d0d8;stroke-width:1;stroke-dasharray:4 4}
.limit{stroke:#8a3232;stroke-width:2;stroke-dasharray:7 5}.curve1{stroke:#245b7a;stroke-width:3;fill:none}
.curve2{stroke:#8a4f13;stroke-width:3;fill:none}.curve3{stroke:#477a55;stroke-width:3;fill:none}
.curve4{stroke:#7856a8;stroke-width:3;fill:none}.failed{stroke:#8a3232;stroke-width:3;fill:none;stroke-dasharray:8 5}
.arrow{stroke:#245b7a;stroke-width:3;fill:none;marker-end:url(#arrow)}
.arrowo{stroke:#8a4f13;stroke-width:3;fill:none;marker-end:url(#arrowo)}
.arrowg{stroke:#477a55;stroke-width:3;fill:none;marker-end:url(#arrowg)}
</style>

<text x="35" y="40" class="title" text-anchor="start">Impedance fidelity is a guarded transformation path</text>
<text x="35" y="68" class="sub" text-anchor="start">Each arrow adds a declared approximation or coordinate change; the matrix alone is not the complete electrical factor.</text>
<rect x="35" y="105" width="1330" height="500" rx="14" class="panel"/>
<text x="65" y="142" class="head" text-anchor="start">physical provenance → electrical relation → decision model</text>
<rect x="65" y="245" width="210" height="150" rx="12" class="blue"/>
<text x="170" y="280" class="head" text-anchor="middle">circuit primitive</text>
<text x="170" y="320" class="small" text-anchor="middle">wire data · geometry</text>
<text x="170" y="344" class="small" text-anchor="middle">earth · frequency</text>
<rect x="330" y="245" width="210" height="150" rx="12" class="blue"/>
<text x="435" y="280" class="head" text-anchor="middle">conductor primitive</text>
<text x="435" y="320" class="small" text-anchor="middle">R, X, shunt blocks</text>
<text x="435" y="344" class="small" text-anchor="middle">ordered conductors</text>
<rect x="595" y="245" width="210" height="150" rx="12" class="green"/>
<text x="700" y="280" class="head" text-anchor="middle">phase view</text>
<text x="700" y="320" class="small" text-anchor="middle">terminal maps</text>
<text x="700" y="344" class="small" text-anchor="middle">neutral decision</text>
<rect x="860" y="245" width="210" height="150" rx="12" class="orange"/>
<text x="965" y="280" class="head" text-anchor="middle">sequence coordinates</text>
<text x="965" y="320" class="small" text-anchor="middle">F invertible</text>
<text x="965" y="344" class="small" text-anchor="middle">channels may mix</text>
<rect x="1125" y="245" width="210" height="150" rx="12" class="red"/>
<text x="1230" y="280" class="head" text-anchor="middle">restricted scalar</text>
<text x="1230" y="320" class="small" text-anchor="middle">D / F₁</text>
<text x="1230" y="344" class="small" text-anchor="middle">positive sequence</text>
<path d="M275 320 L330 320" class="arrowo"/>
<text x="302" y="285" class="small" text-anchor="middle">K_g</text>
<text x="302" y="425" class="tiny" text-anchor="middle">grounding / invertibility</text>
<path d="M540 320 L595 320" class="arrowo"/>
<text x="567" y="285" class="small" text-anchor="middle">K_n / P_n</text>
<text x="567" y="425" class="tiny" text-anchor="middle">neutral guard; possible loss</text>
<path d="M805 320 L860 320" class="arrowo"/>
<text x="832" y="285" class="small" text-anchor="middle">F</text>
<text x="832" y="425" class="tiny" text-anchor="middle">coordinate change</text>
<path d="M1070 320 L1125 320" class="arrowo"/>
<text x="1097" y="285" class="small" text-anchor="middle">D / F₁</text>
<text x="1097" y="425" class="tiny" text-anchor="middle">sequence closure / restriction</text>
<rect x="65" y="480" width="1270" height="78" rx="10" class="orange"/>
<text x="85" y="513" class="head" text-anchor="start">Loss ledger</text>
<text x="215" y="507" class="small" text-anchor="start">neutral/common-mode coordinates, sequence coupling, phase-specific limits, shunt placement, and source geometry</text>
<text x="215" y="532" class="small" text-anchor="start">are forgotten only when the guard and preservation target say so.</text>
<rect x="35" y="655" width="1330" height="70" rx="10" class="green"/>
<text x="55" y="685" class="head" text-anchor="start">Reading rule</text>
<text x="185" y="685" class="body" text-anchor="start">A positive-sequence edge is a derived view—not a primitive fact about the asset—and must retain its transformation path.</text>
</svg>
