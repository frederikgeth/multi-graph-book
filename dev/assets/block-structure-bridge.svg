<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
<title>One four-wire factor across four graph and equation views</title>
<desc>A two-bus four-wire factor is shown as a vector edge, a port-factor incidence object, a block nodal operator, and a scalar or realified support pattern. These are views of one declared factor, not interchangeable graph semantics.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.port{fill:#fff;stroke:#245b7a;stroke-width:2}
.factor{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.wire{stroke:#245b7a;stroke-width:4;fill:none}
.wire2{stroke:#7856a8;stroke-width:2;fill:none}.grid{stroke:#17212b;stroke-width:1.5}
.block{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.block2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.support{stroke:#477a55;stroke-width:2;fill:none}.dashed{stroke:#17212b;stroke-width:2;stroke-dasharray:7 5;fill:none}
</style>

<text x="36" y="42" class="title" text-anchor="start">One four-wire factor, four useful views</text>
<text x="36" y="70" class="sub" text-anchor="start">Lowering changes coordinates and visible structure; it must not silently invent assets or erase factor identity.</text>
<rect x="36" y="105" width="650" height="350" rx="14" class="panel"/>
<text x="58" y="139" class="head" text-anchor="start">A. High-level vector edge</text>
<text x="58" y="163" class="small" text-anchor="start">A two-terminal engineering object with ordered conductor coordinates</text>
<circle cx="150" cy="285" r="48" class="bus"/><text x="150" y="290" class="head" text-anchor="middle">i</text>
<circle cx="570" cy="285" r="48" class="bus"/><text x="570" y="290" class="head" text-anchor="middle">j</text>
<path d="M198 285 L522 285" class="wire"/>
<text x="360" y="265" class="head" text-anchor="middle">ℓᵢⱼ</text>
<text x="360" y="310" class="body" text-anchor="middle">Vᵢ − Vⱼ ∈ ℂ⁴</text>
<text x="150" y="370" class="small" text-anchor="middle">(a,b,c,n)</text>
<text x="570" y="370" class="small" text-anchor="middle">(a,b,c,n)</text>
<text x="360" y="418" class="small" text-anchor="middle">Zℓ, Iℓ, limits, and identity travel with the edge</text>
<rect x="714" y="105" width="650" height="350" rx="14" class="panel"/>
<text x="736" y="139" class="head" text-anchor="start">B. Port–factor incidence</text>
<text x="736" y="163" class="small" text-anchor="start">The canonical electrical view keeps ports, factor identity, and terminal maps explicit</text>
<circle cx="800" cy="285" r="40" class="bus"/><text x="800" y="290" class="head" text-anchor="middle">i</text>
<circle cx="1278" cy="285" r="40" class="bus"/><text x="1278" y="290" class="head" text-anchor="middle">j</text>
<rect x="976" y="210" width="126" height="150" rx="10" class="factor"/>
<text x="1039" y="255" class="head" text-anchor="middle">φℓ</text>
<text x="1039" y="285" class="body" text-anchor="middle">factor</text>
<text x="1039" y="315" class="small" text-anchor="middle">2-port · 4 conductors</text>
<circle cx="875" cy="225" r="7" class="port"/>
<circle cx="1203" cy="225" r="7" class="port"/>
<path d="M840 285 L875 225 L976 225" class="wire2"/>
<path d="M1102 225 L1203 225 L1240 285" class="wire2"/>
<text x="875" y="213" class="tiny" text-anchor="middle">a</text>
<text x="1203" y="213" class="tiny" text-anchor="middle">a</text>
<circle cx="875" cy="265" r="7" class="port"/>
<circle cx="1203" cy="265" r="7" class="port"/>
<path d="M840 285 L875 265 L976 265" class="wire2"/>
<path d="M1102 265 L1203 265 L1240 285" class="wire2"/>
<text x="875" y="253" class="tiny" text-anchor="middle">b</text>
<text x="1203" y="253" class="tiny" text-anchor="middle">b</text>
<circle cx="875" cy="305" r="7" class="port"/>
<circle cx="1203" cy="305" r="7" class="port"/>
<path d="M840 285 L875 305 L976 305" class="wire2"/>
<path d="M1102 305 L1203 305 L1240 285" class="wire2"/>
<text x="875" y="293" class="tiny" text-anchor="middle">c</text>
<text x="1203" y="293" class="tiny" text-anchor="middle">c</text>
<circle cx="875" cy="345" r="7" class="port"/>
<circle cx="1203" cy="345" r="7" class="port"/>
<path d="M840 285 L875 345 L976 345" class="wire2"/>
<path d="M1102 345 L1203 345 L1240 285" class="wire2"/>
<text x="875" y="333" class="tiny" text-anchor="middle">n</text>
<text x="1203" y="333" class="tiny" text-anchor="middle">n</text>
<text x="1039" y="418" class="small" text-anchor="middle">source fibre: {ℓ}  ·  terminal maps: Tᵢ, Tⱼ</text>
<rect x="36" y="485" width="650" height="350" rx="14" class="panel"/>
<text x="58" y="519" class="head" text-anchor="start">C. Block nodal operator</text>
<text x="58" y="543" class="small" text-anchor="start">Assembly exposes a 2×2 matrix of 4×4 conductor blocks</text>
<rect x="225" y="580" width="170" height="75" class="block"/>
<text x="310.0" y="623" class="head" text-anchor="middle">Yᵢᵢ</text>
<text x="310.0" y="650" class="small" text-anchor="middle">ℂ⁴ˣ⁴</text>
<rect x="395" y="580" width="170" height="75" class="block2"/>
<text x="480.0" y="623" class="head" text-anchor="middle">Yᵢⱼ</text>
<text x="480.0" y="650" class="small" text-anchor="middle">ℂ⁴ˣ⁴</text>
<rect x="225" y="655" width="170" height="75" class="block2"/>
<text x="310.0" y="698" class="head" text-anchor="middle">Yⱼᵢ</text>
<text x="310.0" y="725" class="small" text-anchor="middle">ℂ⁴ˣ⁴</text>
<rect x="395" y="655" width="170" height="75" class="block"/>
<text x="480.0" y="698" class="head" text-anchor="middle">Yⱼⱼ</text>
<text x="480.0" y="725" class="small" text-anchor="middle">ℂ⁴ˣ⁴</text>
<text x="180" y="620" class="head" text-anchor="middle">i</text>
<text x="180" y="695" class="head" text-anchor="middle">j</text>
<text x="310" y="560" class="head" text-anchor="middle">i</text>
<text x="480" y="560" class="head" text-anchor="middle">j</text>
<text x="310" y="750" class="body" text-anchor="middle">Y = [ Yᵢᵢ  Yᵢⱼ ; Yⱼᵢ  Yⱼⱼ ]</text>
<text x="360" y="798" class="small" text-anchor="middle">block support is simple; stamp identity remains separate provenance</text>
<rect x="714" y="485" width="650" height="350" rx="14" class="panel"/>
<text x="736" y="519" class="head" text-anchor="start">D. Scalar support and realification</text>
<text x="736" y="543" class="small" text-anchor="start">Expanding coordinates can reveal dense support without creating new physical members</text>
<path d="M808 590 L772 650" class="support"/>
<path d="M808 590 L772 710" class="support"/>
<path d="M808 590 L772 770" class="support"/>
<path d="M808 590 L912 590" class="support"/>
<path d="M808 590 L912 650" class="support"/>
<path d="M808 590 L912 710" class="support"/>
<path d="M808 590 L912 770" class="support"/>
<path d="M808 650 L772 710" class="support"/>
<path d="M808 650 L772 770" class="support"/>
<path d="M808 650 L912 590" class="support"/>
<path d="M808 650 L912 650" class="support"/>
<path d="M808 650 L912 710" class="support"/>
<path d="M808 650 L912 770" class="support"/>
<path d="M808 710 L772 770" class="support"/>
<path d="M808 710 L912 590" class="support"/>
<path d="M808 710 L912 650" class="support"/>
<path d="M808 710 L912 710" class="support"/>
<path d="M808 710 L912 770" class="support"/>
<path d="M808 770 L912 590" class="support"/>
<path d="M808 770 L912 650" class="support"/>
<path d="M808 770 L912 710" class="support"/>
<path d="M808 770 L912 770" class="support"/>
<path d="M948 590 L912 650" class="support"/>
<path d="M948 590 L912 710" class="support"/>
<path d="M948 590 L912 770" class="support"/>
<path d="M948 650 L912 710" class="support"/>
<path d="M948 650 L912 770" class="support"/>
<path d="M948 710 L912 770" class="support"/>
<circle cx="790" cy="590" r="18" class="bus"/><text x="790" y="595" class="head" text-anchor="middle">ia</text>
<circle cx="790" cy="650" r="18" class="bus"/><text x="790" y="655" class="head" text-anchor="middle">ib</text>
<circle cx="790" cy="710" r="18" class="bus"/><text x="790" y="715" class="head" text-anchor="middle">ic</text>
<circle cx="790" cy="770" r="18" class="bus"/><text x="790" y="775" class="head" text-anchor="middle">in</text>
<circle cx="930" cy="590" r="18" class="bus"/><text x="930" y="595" class="head" text-anchor="middle">ja</text>
<circle cx="930" cy="650" r="18" class="bus"/><text x="930" y="655" class="head" text-anchor="middle">jb</text>
<circle cx="930" cy="710" r="18" class="bus"/><text x="930" y="715" class="head" text-anchor="middle">jc</text>
<circle cx="930" cy="770" r="18" class="bus"/><text x="930" y="775" class="head" text-anchor="middle">jn</text>
<text x="1140" y="600" class="head" text-anchor="middle">8×8 complex support</text>
<text x="1140" y="627" class="small" text-anchor="middle">all 64 scalar entries nonzero</text>
<path d="M960 700 L1100 700" class="dashed"/>
<text x="1140" y="715" class="head" text-anchor="middle">realification</text>
<text x="1140" y="743" class="body" text-anchor="middle">R(Y) = [ G  −B ; B  G ]</text>
<text x="1140" y="773" class="small" text-anchor="middle">twice the coordinates, same declared assets</text>
<text x="1035" y="818" class="small" text-anchor="middle">support answers an algebraic question; factor fibres answer an identity question</text>
<rect x="36" y="865" width="1328" height="42" rx="10" class="factor"/>
<text x="55" y="892" class="head" text-anchor="start">Reading rule</text>
<text x="190" y="892" class="body" text-anchor="start">Use A/B for assets and ports, C for matrix equations, and D for coordinate support or realified numerics. Never infer a physical cycle or new asset from D alone.</text>
</svg>
