<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>Audience routes through the HTML and PDF book</title>
<desc>A central argument spine is shared by HTML and PDF. Five community routes branch to power engineering, software and data, mathematical modelling, graph theory, and graph machine learning chapters.</desc>
<rect width="1400" height="800" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#5f6b76}.head{font-size:17px;font-weight:bold}.node{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.aud1{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.aud2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.aud3{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.aud4{fill:#eee8f8;stroke:#7856a8;stroke-width:2}.aud5{fill:#f7f7f7;stroke:#17212b;stroke-width:2}.small{font-size:13px;fill:#5f6b76}.body{font-size:15px}.line{stroke:#17212b;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{stroke:#5f6b76;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="46" class="title" text-anchor="start">Reading routes through one argument</text>
<text x="40" y="76" class="sub" text-anchor="start">HTML is the full knowledge base; the PDF is a shorter, argument-shaped serialization of the same sources.</text>
<text x="40" y="130" class="head" text-anchor="start">shared spine</text>
<rect x="100" y="155" width="190" height="70" rx="12" class="node"/>
<text x="195" y="197" class="body" text-anchor="middle">scope</text>
<path d="M290 190 L330 190" class="line"/>
<rect x="340" y="155" width="190" height="70" rx="12" class="node"/>
<text x="435" y="197" class="body" text-anchor="middle">representations</text>
<path d="M530 190 L570 190" class="line"/>
<rect x="580" y="155" width="190" height="70" rx="12" class="node"/>
<text x="675" y="197" class="body" text-anchor="middle">contracts</text>
<path d="M770 190 L810 190" class="line"/>
<rect x="820" y="155" width="190" height="70" rx="12" class="node"/>
<text x="915" y="197" class="body" text-anchor="middle">counterexamples</text>
<path d="M1010 190 L1050 190" class="line"/>
<rect x="1060" y="155" width="190" height="70" rx="12" class="node"/>
<text x="1155" y="197" class="body" text-anchor="middle">consequences</text>
<rect x="45" y="420" width="230" height="145" rx="12" class="aud1"/>
<text x="160" y="458" class="head" text-anchor="middle">power engineer</text>
<text x="160" y="490" class="small" text-anchor="middle">physical meaning</text>
<text x="160" y="509" class="small" text-anchor="middle">terminals</text>
<text x="160" y="528" class="small" text-anchor="middle">decisions</text>
<path d="M195 225 C195 330 160 370 160 420" class="branch"/>
<rect x="315" y="490" width="230" height="145" rx="12" class="aud2"/>
<text x="430" y="528" class="head" text-anchor="middle">software / data expert</text>
<text x="430" y="560" class="small" text-anchor="middle">identity</text>
