<text x="202" y="545" class="small" text-anchor="middle">identified lines q,r,s,t,u,v,w</text>
<text x="202" y="575" class="body" text-anchor="middle">member μ = 3; simple μ = 2</text>
<rect x="610" y="475" width="72" height="52" rx="10" class="factor"/>
<text x="646" y="507" class="head" text-anchor="middle">x₁</text>
<line x1="610" y1="485" x2="560" y2="250" class="generated"/><line x1="610" y1="500" x2="645" y2="345" class="generated"/><line x1="682" y1="510" x2="695" y2="445" class="generated"/>
<text x="567" y="545" class="body" text-anchor="middle">source asset: one x₁</text>
<text x="567" y="575" class="small" text-anchor="middle">factor incidence μ = 5</text>
<text x="567" y="600" class="small" text-anchor="middle">no ordinary source edge for x₁</text>
<circle cx="1030" cy="500" r="22" class="virtual"/>
<text x="1030" y="506" class="small" text-anchor="middle">νₓ₁</text>
<line x1="1030" y1="478" x2="925" y2="250" class="generated"/><line x1="1010" y1="500" x2="1010" y2="345" class="generated"/><line x1="1048" y1="513" x2="1055" y2="443" class="generated"/>
<text x="932" y="555" class="body" text-anchor="middle">generated node + three arms</text>
<text x="932" y="582" class="small" text-anchor="middle">embedded member μ = 5</text>
<text x="932" y="607" class="small" text-anchor="middle">local star μ = 0</text>
<line x1="1290" y1="250" x2="1360" y2="315" class="generated"/><line x1="1290" y1="250" x2="1417" y2="410" class="generated"/><line x1="1390" y1="345" x2="1417" y2="410" class="generated"/>
<text x="1297" y="555" class="body" text-anchor="middle">same terminal relation under guards</text>
<text x="1297" y="582" class="small" text-anchor="middle">embedded member μ = 6</text>
<text x="1297" y="607" class="small" text-anchor="middle">local clique μ = 1</text>
<path d="M372 400 L390 400" class="arrow"/><path d="M737 400 L755 400" class="arrow"/><path d="M1102 400 L1120 400" class="arrow"/>
<rect x="80" y="735" width="1340" height="105" rx="14" class="warn"/>
<text x="105" y="770" class="head" text-anchor="start">Loss ledger</text>
<text x="250" y="770" class="body" text-anchor="start">generated arms are not lines</text>
<text x="500" y="770" class="body" text-anchor="start">clique edges are not assets</text>
<text x="770" y="770" class="body" text-anchor="start">winding currents need recovery</text>
<text x="1055" y="770" class="body" text-anchor="start">support cycles are not power-flow loops</text>
<text x="105" y="810" class="small" text-anchor="start">Retain x₁ identity, winding-to-target fibres, connection/tap/grounding semantics, source limits, and the domain of every exactness claim.</text>
<text x="40" y="875" class="small" text-anchor="start">Cycle rank is reported only after the graph construction is named; the source n-port object has no privileged ordinary-edge expansion.</text>
</svg>
