<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<title>The neutral you eliminated is still carrying current</title>
<desc>Boundary voltages can be exact after Kron reduction while a recovered neutral constraint remains decisive.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:14px;fill:#5f6b76}.tiny{font-size:13px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.bus2{fill:#e4f4e7;stroke:#477a55;stroke-width:3}
.wire{stroke:#3d78b5;stroke-width:5}.wire2{stroke:#7856a8;stroke-width:4}
.ground{stroke:#477a55;stroke-width:4}.accent{stroke:#8a4f13;stroke-width:4}
.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:9 7}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.matrix{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.matrix2{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">The neutral you eliminated is still carrying current</text>
<text x="35" y="68" class="sub" text-anchor="start">Boundary voltages can be exact after Kron reduction while a recovered neutral constraint remains decisive.</text>
<rect x="35" y="105" width="600" height="500" rx="12" class="panel"/>
<rect x="765" y="105" width="600" height="500" rx="12" class="panel"/>
<text x="65" y="145" class="head" text-anchor="start">reduced boundary model</text>
<text x="795" y="145" class="head" text-anchor="start">recovery obligation</text>
<line x1="150" y1="330" x2="500" y2="330" class="wire2"/>
<line x1="150" y1="330" x2="325" y2="470" class="dashed"/>
<line x1="325" y1="470" x2="500" y2="330" class="dashed"/>
<circle cx="150" cy="330" r="30" class="bus"/><text x="150" y="336" class="head" text-anchor="middle">i</text>
<circle cx="500" cy="330" r="30" class="bus"/><text x="500" y="336" class="head" text-anchor="middle">j</text>
<circle cx="325" cy="470" r="28" class="bad"/><text x="325" y="476" class="head" text-anchor="middle">n</text>
<text x="325" y="535" class="small" text-anchor="middle">eliminated</text>
<text x="325" y="565" class="small" text-anchor="middle">from the boundary equation</text>
<text x="325" y="220" class="body" text-anchor="middle">recover under the stated elimination assumptions</text>
<text x="795" y="220" class="body" text-anchor="start">recover the hidden branch current</text>
<text x="795" y="275" class="head" text-anchor="start">|I_n| = 43.0 A</text>
<text x="795" y="325" class="body" text-anchor="start">declared limit = 42.6 A</text>
<rect x="795" y="365" width="500" height="75" rx="12" class="bad"/>
<text x="1045" y="397" class="head" text-anchor="middle">constraint violated</text>
<text x="1045" y="425" class="tiny" text-anchor="middle">if the recovery constraint is dropped, the target admits it</text>
<rect x="795" y="475" width="500" height="75" rx="12" class="good"/>
<text x="1045" y="507" class="head" text-anchor="middle">resolution: preserve the recovery map</text>
<text x="1045" y="535" class="tiny" text-anchor="middle">and evaluate the neutral limit in the reduced feasible set</text>
<rect x="35" y="650" width="1330" height="70" rx="12" class="card"/>
<text x="55" y="678" class="head" text-anchor="start">which observation?</text>
<text x="245" y="678" class="body" text-anchor="start">Preserving phase behavior alone does not enforce the neutral-current limit; recover the current and check its rating.</text>
</svg>
