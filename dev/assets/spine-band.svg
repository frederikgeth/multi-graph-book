<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="250" viewBox="0 0 1400 250">
<title>Chapter-header argument spine with guarded rules highlighted</title>
<desc>A thin nine-stage chapter route highlights the guarded-rules stage and places it between decision counterexamples and legitimate collapses.</desc>
<rect width="1400" height="250" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:bold}.sub{font-size:14px;fill:#5f6b76}.stage{fill:#f4f6f8;stroke:#8a959f;stroke-width:2}.active{fill:#e4f4e7;stroke:#477a55;stroke-width:3}.num{font-size:13px;font-weight:bold}.label{font-size:14px;font-weight:bold}.arrow{stroke:#8a959f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" fill="#8a959f"/></marker></defs>
<text x="40" y="36" class="title" text-anchor="start">Chapter route · current spine stage: guarded rules</text>
<text x="40" y="60" class="sub" text-anchor="start">Use the band as a local orientation cue; it is a route, not a hierarchy of claims.</text>
<rect x="40" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="54" y="129" class="num" text-anchor="start">1</text>
<text x="106.0" y="153" class="label" text-anchor="middle">scope</text>
<path d="M176 141 L186 141" class="arrow"/>
<rect x="190" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="204" y="129" class="num" text-anchor="start">2</text>
<text x="256.0" y="153" class="label" text-anchor="middle">views</text>
<path d="M326 141 L336 141" class="arrow"/>
<rect x="340" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="354" y="129" class="num" text-anchor="start">3</text>
<text x="406.0" y="153" class="label" text-anchor="middle">maps</text>
<path d="M476 141 L486 141" class="arrow"/>
<rect x="490" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="504" y="129" class="num" text-anchor="start">4</text>
<text x="556.0" y="153" class="label" text-anchor="middle">contracts</text>
<path d="M626 141 L636 141" class="arrow"/>
<rect x="640" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="654" y="129" class="num" text-anchor="start">5</text>
<text x="706.0" y="153" class="label" text-anchor="middle">exactness</text>
<path d="M776 141 L786 141" class="arrow"/>
<rect x="790" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="804" y="129" class="num" text-anchor="start">6</text>
<text x="856.0" y="153" class="label" text-anchor="middle">decisions</text>
<path d="M926 141 L936 141" class="arrow"/>
<rect x="940" y="105" width="132" height="72" rx="11" class="active"/>
<text x="954" y="129" class="num" text-anchor="start">7</text>
<text x="1006.0" y="153" class="label" text-anchor="middle">guards</text>
<path d="M1076 141 L1086 141" class="arrow"/>
<rect x="1090" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="1104" y="129" class="num" text-anchor="start">8</text>
<text x="1156.0" y="153" class="label" text-anchor="middle">collapses</text>
<path d="M1226 141 L1236 141" class="arrow"/>
<rect x="1240" y="105" width="132" height="72" rx="11" class="stage"/>
<text x="1254" y="129" class="num" text-anchor="start">9</text>
<text x="1306.0" y="153" class="label" text-anchor="middle">numerics</text>
<text x="40" y="222" class="sub" text-anchor="start">The highlighted stage supplies the local premise for this chapter; neighbouring stages remain available for navigation.</text>
</svg>
