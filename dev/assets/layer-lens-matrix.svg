<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<title>Construction stages and semantic lenses form a matrix, not a ladder</title>
<desc>Five construction stages are rows and five question lenses are columns. Typed transformations cross rows, while each row can be inspected through identity, connectivity, electrical, decision, and computational lenses.</desc>
<rect width="1500" height="900" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:29px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}.head{font-size:16px;font-weight:bold}.body{font-size:13px}.small{font-size:12px;fill:#5f6b76}.row{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.cell{fill:#fbfcfd;stroke:#9aa5ad;stroke-width:1.5}.branch{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}.warn{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.arrow{stroke:#17212b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="44" class="title" text-anchor="start">Construction stage × semantic lens</text>
<text x="40" y="72" class="sub" text-anchor="start">Rows say how the model was constructed; columns say which question is being asked. Software can span several rows.</text>
<rect x="290" y="105" width="230" height="55" class="branch"/>
<text x="405.0" y="138" class="head" text-anchor="middle">identity / provenance</text>
<rect x="520" y="105" width="230" height="55" class="branch"/>
<text x="635.0" y="138" class="head" text-anchor="middle">connectivity</text>
<rect x="750" y="105" width="230" height="55" class="branch"/>
<text x="865.0" y="138" class="head" text-anchor="middle">electrical behaviour</text>
<rect x="980" y="105" width="230" height="55" class="branch"/>
<text x="1095.0" y="138" class="head" text-anchor="middle">decisions / constraints</text>
<rect x="1210" y="105" width="230" height="55" class="branch"/>
<text x="1325.0" y="138" class="head" text-anchor="middle">software / computation</text>
<rect x="40" y="160" width="250" height="105" class="row"/>
<text x="58" y="203" class="head" text-anchor="start">source asset/property</text>
<text x="58" y="232" class="small" text-anchor="start">stage L0</text>
<rect x="290" y="160" width="230" height="105" class="cell"/>
<text x="405.0" y="205" class="body" text-anchor="middle">asset and</text>
<text x="405.0" y="227" class="body" text-anchor="middle">winding IDs</text>
<rect x="520" y="160" width="230" height="105" class="cell"/>
<text x="635.0" y="216" class="body" text-anchor="middle">terminal attachments</text>
<rect x="750" y="160" width="230" height="105" class="cell"/>
<text x="865.0" y="216" class="body" text-anchor="middle">nameplate + construction</text>
<rect x="980" y="160" width="230" height="105" class="cell"/>
<text x="1095.0" y="216" class="body" text-anchor="middle">states, ratings, ownership</text>
<rect x="1210" y="160" width="230" height="105" class="cell"/>
<text x="1325.0" y="216" class="body" text-anchor="middle">source schema</text>
<rect x="40" y="265" width="250" height="105" class="row"/>
<text x="58" y="308" class="head" text-anchor="start">canonical port–factor</text>
<text x="58" y="337" class="small" text-anchor="start">stage L1</text>
<rect x="290" y="265" width="230" height="105" class="cell"/>
<text x="405.0" y="310" class="body" text-anchor="middle">factor +</text>
<text x="405.0" y="332" class="body" text-anchor="middle">port ownership</text>
<rect x="520" y="265" width="230" height="105" class="cell"/>
<text x="635.0" y="321" class="body" text-anchor="middle">typed junction incidence</text>
<rect x="750" y="265" width="230" height="105" class="cell"/>
<text x="865.0" y="321" class="body" text-anchor="middle">multi-port relation</text>
<rect x="980" y="265" width="230" height="105" class="cell"/>
<text x="1095.0" y="321" class="body" text-anchor="middle">limits, controls, observations</text>
<rect x="1210" y="265" width="230" height="105" class="cell"/>
<text x="1325.0" y="310" class="body" text-anchor="middle">factor API</text>
<text x="1325.0" y="332" class="body" text-anchor="middle">/ IR</text>
<rect x="40" y="370" width="250" height="105" class="row"/>
<text x="58" y="413" class="head" text-anchor="start">optional edge realization</text>
<text x="58" y="442" class="small" text-anchor="start">stage L2</text>
<rect x="290" y="370" width="230" height="105" class="cell"/>
<text x="405.0" y="426" class="body" text-anchor="middle">generated source fibres</text>
<rect x="520" y="370" width="230" height="105" class="cell"/>
<text x="635.0" y="415" class="body" text-anchor="middle">virtual nodes</text>
<text x="635.0" y="437" class="body" text-anchor="middle">+ edges</text>
<rect x="750" y="370" width="230" height="105" class="cell"/>
<text x="865.0" y="426" class="body" text-anchor="middle">guarded equivalent</text>
<rect x="980" y="370" width="230" height="105" class="cell"/>
<text x="1095.0" y="426" class="body" text-anchor="middle">lifted source constraints</text>
<rect x="1210" y="370" width="230" height="105" class="cell"/>
<text x="1325.0" y="426" class="body" text-anchor="middle">edge-algorithm adapter</text>
<rect x="40" y="475" width="250" height="105" class="row"/>
<text x="58" y="518" class="head" text-anchor="start">equation / operator</text>
<text x="58" y="547" class="small" text-anchor="start">stage L3</text>
<rect x="290" y="475" width="230" height="105" class="cell"/>
<text x="405.0" y="531" class="body" text-anchor="middle">constraint ownership map</text>
<rect x="520" y="475" width="230" height="105" class="cell"/>
<text x="635.0" y="531" class="body" text-anchor="middle">variable incidence</text>
<rect x="750" y="475" width="230" height="105" class="cell"/>
<text x="865.0" y="531" class="body" text-anchor="middle">residuals or Y/MNA/tableau</text>
<rect x="980" y="475" width="230" height="105" class="cell"/>
<text x="1095.0" y="520" class="body" text-anchor="middle">feasible set</text>
<text x="1095.0" y="542" class="body" text-anchor="middle">+ objective</text>
<rect x="1210" y="475" width="230" height="105" class="cell"/>
<text x="1325.0" y="531" class="body" text-anchor="middle">solver formulation</text>
<rect x="40" y="580" width="250" height="105" class="row"/>
<text x="58" y="623" class="head" text-anchor="start">support / algorithm graph</text>
<text x="58" y="652" class="small" text-anchor="start">stage L4</text>
<rect x="290" y="580" width="230" height="105" class="cell"/>
<text x="405.0" y="636" class="body" text-anchor="middle">external metadata only</text>
<rect x="520" y="580" width="230" height="105" class="cell"/>
<text x="635.0" y="636" class="body" text-anchor="middle">nonzero adjacency</text>
<rect x="750" y="580" width="230" height="105" class="cell"/>
<text x="865.0" y="636" class="body" text-anchor="middle">coupling pattern only</text>
<rect x="980" y="580" width="230" height="105" class="cell"/>
<text x="1095.0" y="636" class="body" text-anchor="middle">not native</text>
<rect x="1210" y="580" width="230" height="105" class="cell"/>
<text x="1325.0" y="625" class="body" text-anchor="middle">sparse /</text>
<text x="1325.0" y="647" class="body" text-anchor="middle">graph / GNN</text>
<path d="M265 250 L265 280" class="arrow"/><path d="M265 355 L265 385" class="arrow"/><path d="M265 460 L265 490" class="arrow"/><path d="M265 565 L265 595" class="arrow"/>
<text x="245" y="273" class="small" text-anchor="end">canonicalize</text>
<text x="245" y="378" class="small" text-anchor="end">optional compile</text>
<text x="245" y="483" class="small" text-anchor="end">assemble</text>
<text x="245" y="588" class="small" text-anchor="end">project support</text>
<rect x="40" y="720" width="1420" height="110" rx="14" class="warn"/>
<text x="65" y="755" class="head" text-anchor="start">Transformations are typed arrows, not extra layers</text>
<text x="65" y="785" class="body" text-anchor="start">Projection, normalization, compilation, elimination, behavioural reduction, approximation, and graph surgery may branch at different rows.</text>
<text x="65" y="810" class="small" text-anchor="start">Every branch declares its interface, generated objects, preservation dimensions, omissions, provenance, and recovery status.</text>
<text x="40" y="875" class="small" text-anchor="start">No cell is universally ‘more expressive’: sufficiency is relative to the query family and declared transformation contract.</text>
</svg>
