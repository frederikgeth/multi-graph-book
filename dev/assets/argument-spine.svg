<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<title>The argument spine of the book</title>
<desc>Nine linked claims guide the reader from graph ambiguity through query-relative transformations, decision counterexamples, guarded rules, legitimate collapses, and numerical consequences.</desc>
<rect width="1400" height="760" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#5f6b76}.step{fill:#d9eef8;stroke:#245b7a;stroke-width:2}.step.alt{fill:#f8e1c4;stroke:#8a4f13}.step.final{fill:#e4f4e7;stroke:#477a55}.num{font-size:18px;font-weight:bold}.head{font-size:17px;font-weight:bold}.small{font-size:14px;fill:#5f6b76}.arrow{stroke:#17212b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17212b"/></marker></defs>
<text x="40" y="46" class="title" text-anchor="start">The argument spine</text>
<text x="40" y="76" class="sub" text-anchor="start">Read 1–5 left to right, then 6–9 right to left; each step adds to one cumulative argument.</text>
<rect x="50" y="145" width="220" height="150" rx="14" class="step"/>
<text x="68" y="175" class="num" text-anchor="start">1</text>
<text x="68" y="210" class="head" text-anchor="start">graph is</text>
<text x="68" y="230" class="head" text-anchor="start">ambiguous</text>
<text x="68" y="262" class="small" text-anchor="start">scope +</text>
<text x="68" y="282" class="small" text-anchor="start">translation traps</text>
<rect x="315" y="145" width="220" height="150" rx="14" class="step alt"/>
<text x="333" y="175" class="num" text-anchor="start">2</text>
<text x="333" y="210" class="head" text-anchor="start">views answer</text>
<text x="333" y="230" class="head" text-anchor="start">different questions</text>
<text x="333" y="262" class="small" text-anchor="start">taxonomy +</text>
<text x="333" y="282" class="small" text-anchor="start">frameworks</text>
<rect x="580" y="145" width="220" height="150" rx="14" class="step"/>
<text x="598" y="175" class="num" text-anchor="start">3</text>
<text x="598" y="210" class="head" text-anchor="start">there is no</text>
<text x="598" y="230" class="head" text-anchor="start">universal ladder</text>
<text x="598" y="262" class="small" text-anchor="start">maps +</text>
<text x="598" y="282" class="small" text-anchor="start">query factorization</text>
<rect x="845" y="145" width="220" height="150" rx="14" class="step alt"/>
<text x="863" y="175" class="num" text-anchor="start">4</text>
<text x="863" y="210" class="head" text-anchor="start">a transformation</text>
<text x="863" y="230" class="head" text-anchor="start">needs a contract</text>
<text x="863" y="262" class="small" text-anchor="start">preservation +</text>
<text x="863" y="282" class="small" text-anchor="start">recovery</text>
<rect x="1110" y="145" width="220" height="150" rx="14" class="step"/>
<text x="1128" y="175" class="num" text-anchor="start">5</text>
<text x="1128" y="210" class="head" text-anchor="start">exactness is</text>
<text x="1128" y="230" class="head" text-anchor="start">observation-relative</text>
<text x="1128" y="272" class="small" text-anchor="start">exact / inner / outer / scenario</text>
<rect x="1110" y="455" width="220" height="150" rx="14" class="step alt"/>
<text x="1128" y="485" class="num" text-anchor="start">6</text>
<text x="1128" y="520" class="head" text-anchor="start">equations can survive</text>
<text x="1128" y="540" class="head" text-anchor="start">while decisions break</text>
<text x="1128" y="582" class="small" text-anchor="start">parallel-line counterexample</text>
<rect x="845" y="455" width="220" height="150" rx="14" class="step"/>
<text x="863" y="485" class="num" text-anchor="start">7</text>
<text x="863" y="520" class="head" text-anchor="start">guards make rules</text>
<text x="863" y="540" class="head" text-anchor="start">checkable</text>
<text x="863" y="572" class="small" text-anchor="start">certificates +</text>
<text x="863" y="592" class="small" text-anchor="start">refusals</text>
<rect x="580" y="455" width="220" height="150" rx="14" class="step alt"/>
<text x="598" y="485" class="num" text-anchor="start">8</text>
<text x="598" y="520" class="head" text-anchor="start">legitimate collapses</text>
<text x="598" y="540" class="head" text-anchor="start">have conditions</text>
<text x="598" y="572" class="small" text-anchor="start">positive sequence +</text>
<text x="598" y="592" class="small" text-anchor="start">reductions</text>
<rect x="315" y="455" width="220" height="150" rx="14" class="step final"/>
<text x="333" y="485" class="num" text-anchor="start">9</text>
<text x="333" y="520" class="head" text-anchor="start">representation has</text>
<text x="333" y="540" class="head" text-anchor="start">numerical cost</text>
<text x="333" y="572" class="small" text-anchor="start">conditioning +</text>
<text x="333" y="592" class="small" text-anchor="start">fill + margins</text>
<path d="M270 220 L315 220" class="arrow"/>
<path d="M535 220 L580 220" class="arrow"/>
<path d="M800 220 L845 220" class="arrow"/>
<path d="M1065 220 L1110 220" class="arrow"/>
<path d="M1220 295 L1220 455" class="arrow"/>
<path d="M1110 530 L1065 530" class="arrow"/>
<path d="M845 530 L800 530" class="arrow"/>
<path d="M580 530 L535 530" class="arrow"/>
<text x="50" y="685" class="small" text-anchor="start">The spine is a navigation device, not a claim hierarchy: later chapters can refine or qualify an earlier link.</text>
</svg>
