<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<title>Four operations can all make a model ‘smaller’—but not in the same sense</title>
<desc>Projection, normalization, compilation, and behavioural reduction change different dimensions of a model space.</desc>
<defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#245b7a"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a4f13"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#477a55"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}
.title{font-size:28px;font-weight:bold}.sub{font-size:16px;fill:#5f6b76}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.head{font-size:19px;font-weight:bold}
.body{font-size:15px}.small{font-size:13px;fill:#5f6b76}.tiny{font-size:12px;fill:#5f6b76}
.bus{fill:#d9eef8;stroke:#245b7a;stroke-width:3}.factor{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
.asset{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.port{fill:white;stroke:#8a4f13;stroke-width:2}
.jmap{stroke:#245b7a;stroke-width:3;marker-end:url(#arrowBlue)}.fmap{stroke:#8a4f13;stroke-width:3;marker-end:url(#arrowOrange)}
.lambda{stroke:#477a55;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowGreen)}
.wire{stroke:#3d78b5;stroke-width:4}.dashed{stroke:#8a3232;stroke-width:3;stroke-dasharray:8 6}
.matrix{fill:#eee8f8;stroke:#7856a8;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}
.warn{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.card{fill:#f8e1c4;stroke:#8a4f13;stroke-width:2}
</style>

<text x="35" y="40" class="title" text-anchor="start">Four operations can all make a model ‘smaller’—but not in the same sense</text>
<text x="35" y="68" class="sub" text-anchor="start">Projection, normalization, compilation, and behavioural reduction change different dimensions of a model space.</text>
<rect x="45" y="230" width="250" height="180" rx="12" class="card"/>
<text x="170" y="270" class="head" text-anchor="middle">one typed source</text>
<text x="170" y="315" class="body" text-anchor="middle">4 nodes / 6 edges</text>
<text x="170" y="350" class="small" text-anchor="middle">assets + ports + factors</text>
<text x="170" y="385" class="small" text-anchor="middle">structure and provenance</text>
<line x1="295" y1="320" x2="350" y2="320" class="wire" stroke-width="4"/>
<rect x="350" y="190" width="235" height="260" rx="12" class="warn"/>
<text x="467" y="235" class="head" text-anchor="middle">projection</text>
<text x="467" y="290" class="body" text-anchor="middle">4 → 4 nodes</text>
<text x="467" y="325" class="body" text-anchor="middle">6 → 3 edges</text>
<text x="467" y="375" class="small" text-anchor="middle">forgets identity</text>
<line x1="295" y1="320" x2="610" y2="320" class="wire" stroke-width="4"/>
<rect x="610" y="190" width="235" height="260" rx="12" class="good"/>
<text x="727" y="235" class="head" text-anchor="middle">normalization</text>
<text x="727" y="290" class="body" text-anchor="middle">4 → 4 nodes</text>
<text x="727" y="325" class="body" text-anchor="middle">6 → 6 edges</text>
<text x="727" y="375" class="small" text-anchor="middle">same class</text>
<line x1="295" y1="320" x2="870" y2="320" class="wire" stroke-width="4"/>
<rect x="870" y="190" width="235" height="260" rx="12" class="card"/>
<text x="987" y="235" class="head" text-anchor="middle">compilation</text>
<text x="987" y="290" class="body" text-anchor="middle">3 → 5 nodes</text>
<text x="987" y="325" class="body" text-anchor="middle">1 → 6 edges</text>
<text x="987" y="375" class="small" text-anchor="middle">adds virtual objects</text>
<line x1="295" y1="320" x2="1130" y2="320" class="wire" stroke-width="4"/>
<rect x="1130" y="190" width="235" height="260" rx="12" class="matrix"/>
<text x="1247" y="235" class="head" text-anchor="middle">behavioural reduction</text>
<text x="1247" y="290" class="body" text-anchor="middle">4 → 3 nodes</text>
<text x="1247" y="325" class="body" text-anchor="middle">4 → 5 edges</text>
<text x="1247" y="375" class="small" text-anchor="middle">denser fill / fewer vars</text>
<rect x="45" y="520" width="1320" height="105" rx="12" class="card"/>
<text x="70" y="556" class="head" text-anchor="start">size is not semantics</text>
<text x="70" y="586" class="body" text-anchor="start">Compilation can grow a graph while simplifying the device vocabulary; elimination can remove vertices while adding fill edges; projection can shrink while losing identities.</text>
<text x="70" y="610" class="small" text-anchor="start">The transformation type and preservation contract—not node count—decide what survived.</text>
<text x="55" y="700" class="small" text-anchor="start">Counts are schematic teaching examples; the arrows classify operation types, not one single running-network instance.</text>
</svg>
