<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<title>Variable signatures determine which BIM/BFM questions are expressible</title>
<desc>A shared bus-pair variable and member-indexed variables describe different relaxation spaces.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.warn{fill:#fff3dc;stroke:#a36516;stroke-width:2}.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.ink{stroke:#17212b;stroke-width:2}.ok{fill:#2f6b3b}.red{fill:#8a3232}.amber{fill:#a36516}
</style>

<text x="35" y="40" class="title" text-anchor="start">Variable signatures determine which BIM/BFM questions are expressible</text>
<text x="35" y="68" class="sub" text-anchor="start">A shared bus-pair variable and member-indexed variables describe different relaxation spaces.</text>
<rect x="55" y="125" width="1290" height="520" rx="10" class="panel"/>
<text x="85" y="170" class="head" text-anchor="start">question</text>
<text x="720" y="170" class="head" text-anchor="middle">shared W_ij</text>
<text x="1080" y="170" class="head" text-anchor="middle">member-indexed W_lij / S_lij</text>
<line x1="80" y1="195" x2="1310" y2="195" class="ink" stroke-width="1"/>
<text x="85" y="220" class="body" text-anchor="start">member current limit</text>
<text x="720" y="220" class="head" text-anchor="middle">✗</text>
<text x="1080" y="220" class="head" text-anchor="middle">✓</text>
<line x1="80" y1="273" x2="1310" y2="273" class="ink" stroke-width="1"/>
<text x="85" y="298" class="body" text-anchor="start">independent outage/state</text>
<text x="720" y="298" class="head" text-anchor="middle">✗</text>
<text x="1080" y="298" class="head" text-anchor="middle">✓</text>
<line x1="80" y1="351" x2="1310" y2="351" class="ink" stroke-width="1"/>
<text x="85" y="376" class="body" text-anchor="start">recovered branch current</text>
<text x="720" y="376" class="head" text-anchor="middle">✗</text>
<text x="1080" y="376" class="head" text-anchor="middle">✓</text>
<line x1="80" y1="429" x2="1310" y2="429" class="ink" stroke-width="1"/>
<text x="85" y="454" class="body" text-anchor="start">member measurement</text>
<text x="720" y="454" class="head" text-anchor="middle">✗</text>
<text x="1080" y="454" class="head" text-anchor="middle">✓</text>
<line x1="80" y1="507" x2="1310" y2="507" class="ink" stroke-width="1"/>
<text x="85" y="532" class="body" text-anchor="start">common voltage-drop consistency</text>
<text x="720" y="532" class="head" text-anchor="middle">implicit</text>
<text x="1080" y="532" class="head" text-anchor="middle">explicit</text>
<rect x="85" y="545" width="1210" height="62" rx="10" class="warn"/>
<text x="105" y="582" class="body" text-anchor="start">Missing relation: Z_l* S_lij = Z_k* S_kij. Aggregate balance can pass while no common voltage drop exists.</text>
<text x="65" y="705" class="small" text-anchor="start">Notation capability plate, not a new numerical certificate: the chapter's equations define the scope boundary.</text>
</svg>
