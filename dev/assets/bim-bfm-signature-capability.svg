<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<title>Shared voltage coordinates can retain member constraints</title>
<desc>Fixed scalar series members: indexed admittances and recovery maps retain the member distinction.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.warn{fill:#fff3dc;stroke:#a36516;stroke-width:2}.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.ink{stroke:#17212b;stroke-width:2}.ok{fill:#2f6b3b}.red{fill:#8a3232}.amber{fill:#a36516}
</style>

<text x="35" y="40" class="title" text-anchor="start">Shared voltage coordinates can retain member constraints</text>
<text x="35" y="68" class="sub" text-anchor="start">Fixed scalar series members: indexed admittances and recovery maps retain the member distinction.</text>
<rect x="55" y="125" width="1290" height="520" rx="10" class="panel"/>
<text x="85" y="170" class="head" text-anchor="start">question</text>
<text x="685" y="170" class="head" text-anchor="middle">shared W + member data</text>
<text x="1090" y="170" class="head" text-anchor="middle">separate W + equalities</text>
<line x1="80" y1="195" x2="1310" y2="195" class="ink" stroke-width="1"/>
<text x="85" y="220" class="body" text-anchor="start">member current limit</text>
<text x="685" y="220" class="body" text-anchor="middle">yes: member data + bound</text>
<text x="1090" y="220" class="body" text-anchor="middle">yes: same physical relation</text>
<line x1="80" y1="260" x2="1310" y2="260" class="ink" stroke-width="1"/>
<text x="85" y="285" class="body" text-anchor="start">independent outage/state</text>
<text x="685" y="285" class="body" text-anchor="middle">requires state-dependent laws</text>
<text x="1090" y="285" class="body" text-anchor="middle">requires state-dependent laws</text>
<line x1="80" y1="325" x2="1310" y2="325" class="ink" stroke-width="1"/>
<text x="85" y="350" class="body" text-anchor="start">recovered branch current</text>
<text x="685" y="350" class="body" text-anchor="middle">yes: member current map</text>
<text x="1090" y="350" class="body" text-anchor="middle">yes: member current map</text>
<line x1="80" y1="390" x2="1310" y2="390" class="ink" stroke-width="1"/>
<text x="85" y="415" class="body" text-anchor="start">member measurement</text>
<text x="685" y="415" class="body" text-anchor="middle">yes: observation map</text>
<text x="1090" y="415" class="body" text-anchor="middle">yes: observation map</text>
<line x1="80" y1="455" x2="1310" y2="455" class="ink" stroke-width="1"/>
<text x="85" y="480" class="body" text-anchor="start">common voltage products</text>
<text x="685" y="480" class="body" text-anchor="middle">shared by construction</text>
<text x="1090" y="480" class="body" text-anchor="middle">equality constraints required</text>
<rect x="85" y="545" width="1210" height="62" rx="10" class="warn"/>
<text x="105" y="582" class="body" text-anchor="start">Dropping consistency equalities can change a relaxation; adding an index alone proves no equivalence.</text>
<text x="65" y="705" class="small" text-anchor="start">Squared member current: |Y_l|^2 (W_ii + W_jj - 2 Re W_ij). Source member data must remain available.</text>
</svg>
