<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="820" viewBox="0 0 1450 820">
<title>Parallel-member limits: aggregation is not a decision certificate</title>
<desc>The same terminal relation can be aggregated, while member constraints require a recovered exact pruning map.</desc>
<rect width="100%" height="100%" fill="white"/>

<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#5f6b76}
.head{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px;fill:#46525d}.tiny{font-size:12px;fill:#46525d}
.panel{fill:#fbfcfd;stroke:#17212b;stroke-width:2}.good{fill:#e4f4e7;stroke:#477a55;stroke-width:2}.warn{fill:#fff3dc;stroke:#a36516;stroke-width:2}.bad{fill:#f4e5e5;stroke:#8a3232;stroke-width:2}.ink{stroke:#17212b;stroke-width:2}.ok{fill:#2f6b3b}.red{fill:#8a3232}.amber{fill:#a36516}
</style>

<text x="35" y="40" class="title" text-anchor="start">Parallel-member limits: aggregation is not a decision certificate</text>
<text x="35" y="68" class="sub" text-anchor="start">The same terminal relation can be aggregated, while member constraints require a recovered exact pruning map.</text>
<rect x="45" y="125" width="410" height="470" rx="10" class="panel"/>
<rect x="505" y="125" width="410" height="470" rx="10" class="bad"/>
<rect x="965" y="125" width="440" height="470" rx="10" class="good"/>
<text x="70" y="165" class="head" text-anchor="start">source / exact pruning</text>
<text x="70" y="210" class="body" text-anchor="start">member identities retained</text>
<text x="70" y="270" class="tiny" text-anchor="start">served fraction</text>
<text x="70" y="305" class="head" text-anchor="start">1.1286205</text>
<text x="70" y="370" class="tiny" text-anchor="start">recovery relation</text>
<text x="70" y="400" class="small" text-anchor="start">full Pi terminal-current map</text>
<text x="70" y="465" class="tiny" text-anchor="start">independent gap</text>
<text x="70" y="493" class="small" text-anchor="start">1.37e-08</text>
<text x="530" y="165" class="head" text-anchor="start">naive aggregate</text>
<text x="530" y="210" class="body" text-anchor="start">one summed member limit</text>
<text x="530" y="270" class="tiny" text-anchor="start">served fraction</text>
<text x="530" y="305" class="head" text-anchor="start">1.8077114</text>
<text x="530" y="370" class="tiny" text-anchor="start">outer-relaxation gap</text>
<text x="530" y="402" class="head" text-anchor="start">0.6790908</text>
<text x="530" y="465" class="tiny" text-anchor="start">forgotten</text>
<text x="530" y="493" class="small" text-anchor="start">member-specific terminal constraints</text>
<text x="990" y="165" class="head" text-anchor="start">certificate</text>
<text x="990" y="210" class="body" text-anchor="start">TR-PAR-007</text>
<text x="990" y="270" class="tiny" text-anchor="start">exact pruning residual</text>
<text x="990" y="302" class="head" text-anchor="start">1.17e-13</text>
<text x="990" y="365" class="tiny" text-anchor="start">guards</text>
<text x="990" y="394" class="small" text-anchor="start">nonsingular maps; fixed state</text>
<text x="990" y="420" class="small" text-anchor="start">and voltage domain; full recovery</text>
<text x="990" y="490" class="tiny" text-anchor="start">lesson</text>
<text x="990" y="518" class="small" text-anchor="start">aggregate admittance ≠ aggregate</text>
<text x="990" y="540" class="small" text-anchor="start">ampacity unless the implication is proved</text>
<rect x="45" y="650" width="1360" height="80" rx="10" class="panel"/>
<text x="70" y="690" class="body" text-anchor="start">The exact target keeps one member's limits only because the certificate proves they imply the other member's limits under the declared map.</text>
</svg>
